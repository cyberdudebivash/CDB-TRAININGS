title: Failed Windows Logon From A Source That Is Not The VPN NAT Gateway
name: win_failed_logon_not_vpn
id: 0b6e1c77-9a34-4d2f-8e51-6f7a8b9c0d03
status: test
description: >
  Failed logons excluding the VPN gateway address, where many users legitimately share one source IP.
  Uses the SrcRole field added by `soc_lab enrich` from the asset inventory.
author: CDB Academy
date: 2026-10-14
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  filter_vpn:
    SrcRole: vpn_nat
  condition: selection and not filter_vpn
level: informational
---
title: Failed Windows Logon Through The VPN NAT Gateway
