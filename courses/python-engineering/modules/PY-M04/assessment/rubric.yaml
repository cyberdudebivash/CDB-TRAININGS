# Public rubric for the PY-M04 independent lab (logslice). Students see exactly how they are graded.
# Mechanical criteria (kind: automated) are measured by running ../lab-independent/checks (pytest); judgement criteria are scored 0-3 by a reviewer.
rubric_id: RUB-PY-M04
module: PY-M04
version: 0.1.0
pass_rule: >
  Every must-pass criterion is met, no reviewer criterion is scored 0, and the reviewer criteria total at least 60% of their maximum.
  Finishing the lesson or the guided lab alone is not a completion claim.
criteria:
  - id: C1
    name: "Declarative metadata"
    outcomes: [LO2]
    kind: automated
    must_pass: true
    measure: "checks: test_only_pyproject_describes_the_build, test_core_metadata, test_src_layout_and_version_are_configured pass"
  - id: C2
    name: "Build and contents"
    outcomes: [LO3]
    kind: automated
    must_pass: true
    measure: "checks: test_build_produces_a_wheel_and_an_sdist and test_wheel_contents_and_metadata pass (no tests/scripts/data in the wheel; py.typed present)"
  - id: C3
    name: "Clean install proves the package"
    outcomes: [LO1, LO4]
    kind: automated
    must_pass: true
    measure: "checks: test_installed_command_filters_the_sample_log passes (wheel installed with --no-index --no-deps into an empty environment, command run from another directory, pip check clean)"
  - id: C4
    name: "Dependency kinds and script metadata"
    outcomes: [LO5]
    kind: automated
    must_pass: true
    measure: "checks: test_extras_and_dependency_groups, test_report_script_declares_inline_metadata and test_report_script_still_runs_without_rich pass"
  - id: C5
    name: "Rationale and honesty about limits"
    outcomes: [LO2, LO5]
    kind: reviewer
    max: 3
    levels:
      0: "No rationale, or claims that contradict the project files."
      1: "States what was done but not why (for example, why `tests` is excluded or why `rich` is an extra)."
      2: "Explains each decision and names the specification or guide section it relies on."
      3: "As 2, plus lists what the checks do not prove (for example, behaviour on Python 3.14 or on another operating system) and how to test it."
  - id: C6
    name: "Reproducibility notes"
    outcomes: [LO4]
    kind: reviewer
    max: 3
    levels:
      0: "No instructions."
      1: "Commands listed but not in an order that works from an empty machine."
      2: "A reader can build, install and run from an empty environment by following the notes."
      3: "As 2, plus states the Python and tool versions used and what to change for a different Python version."
