# Knowledge check for PY-M07. Questions only: the answer key is held by instructors (see courses/python-engineering/instructor/README.md).
module: PY-M07
items:
  - id: Q1
    outcome: LO1
    stem: "Which change makes `conn.execute(f\"SELECT name FROM users WHERE name = '{name}'\")` safe against injection?"
    options: {A: "Replace every apostrophe in name with two apostrophes before building the string", B: "Wrap the f-string in str()", C: "Pass the value as a parameter: conn.execute(\"SELECT name FROM users WHERE name = ?\", (name,))", D: "Convert name to lower case first"}
  - id: Q2
    outcome: LO1
    stem: "A user named O'Brien searches with the f-string query from Q1. What happens?"
    options: {A: "It returns O'Brien's row", B: "The query is a syntax error because the apostrophe ends the string literal early", C: "It returns every row in the table", D: "It returns no rows and no error"}
  - id: Q3
    outcome: LO2
    stem: "Which design for a calculator that evaluates text typed by users fails closed (rejects anything it did not expect)?"
    options: {A: "Parse the text into a syntax tree and accept only a list of allowed node types", B: "Reject text that contains the words import or open, then call eval", C: "Call eval inside try/except and return None on any error", D: "Call eval with an empty dictionary as the builtins"}
  - id: Q4
    outcome: LO2
    stem: "`subprocess.run(f\"ls {path}\", shell=True)` is called with path = \"x; echo hi\". What runs?"
    options: {A: "Only ls, with one odd directory name", B: "Nothing: subprocess refuses text containing a semicolon", C: "ls with the option -x", D: "ls x, and then echo hi, because the shell treats the semicolon as a command separator"}
  - id: Q5
    outcome: LO3
    stem: "Which check confines a user-supplied file name to an attachment folder?"
    options: {A: "Reject names that contain the text ..", B: "Check that the joined, unresolved string starts with the folder path", C: "Resolve the joined path and verify that it lies inside the resolved folder", D: "Check that the file exists"}
  - id: Q6
    outcome: LO3
    stem: "A function calls pickle.loads(blob) and then raises ValueError if the result is not a dict. Why is this not a fix for unsafe deserialisation?"
    options: {A: "The payload's code runs while the data is being loaded, before any check on the result", B: "isinstance checks are too slow", C: "A dict cannot be pickled", D: "Pickle cannot return a dict"}
  - id: Q7
    outcome: LO4
    stem: "Why is hashlib.md5(password.encode()).hexdigest() unsuitable for storing passwords?"
    options: {A: "It produces output that is too long to store", B: "It cannot hash text that contains non-ASCII characters", C: "It was removed from Python 3.13", D: "It is unsalted and fast: equal passwords give equal hashes and an attacker can test guesses cheaply"}
  - id: Q8
    outcome: LO5
    stem: "A security-focused linter run (for example ruff --select S) reports no findings for a module. What can you conclude?"
    options: {A: "The module has no vulnerabilities", B: "None of the patterns the rules know are present; other flaws, such as path traversal, can remain", C: "The module's tests are complete", D: "The module's dependencies are free of known vulnerabilities"}
