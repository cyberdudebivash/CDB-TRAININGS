# Knowledge check for PY-M10. Questions only: the answer key is held by instructors (see courses/python-engineering/instructor/README.md).
module: PY-M10
items:
  - id: Q1
    outcome: LO1
    stem: "A pydantic model declares `code: Annotated[str, Field(pattern=r\"[a-z]{3}\")]`. Which statement about the input `\"abc!!!\"` is true, and what is the repair?"
    options: {A: "It is refused, because a pattern is matched against the whole string and `\"abc!!!\"` is longer than the three letters the pattern describes; no repair is needed", B: "It is refused with an error that repeats the input back to the caller; set `hide_input_in_errors` on the model and keep the pattern as it is", C: "It is accepted, because pydantic's `pattern` is a search and the first three characters match; anchor the pattern with `^` and `$`", D: "It is accepted only in lax mode; strict mode applies the pattern to the whole string, so the repair is to switch the model to strict mode"}
  - id: Q2
    outcome: LO2
    stem: "A service verifies tokens with `jwt.decode(token, key, algorithms=[\"HS256\"])`. A request arrives with a token whose header says `\"alg\": \"none\"` and has no signature. What happens, and what does a hardened service add?"
    options: {A: "The library refuses it with an exception; a hardened service also inspects the header itself first, so that the refusal is a clean `bad_algorithm` result and keys carried in headers (`jwk`, `jku`) are refused too", B: "It is accepted: `none` means the caller chose not to sign, which is allowed when the claims are valid; a hardened service adds nothing because the library already decided and a second check would only duplicate its work", C: "It is accepted if the claims are valid, because the `algorithms` list only applies to signed tokens; a hardened service adds a second list of algorithms that applies to unsigned ones", D: "The library falls back to HS256 and fails the signature check; a hardened service adds nothing, since the fallback already turns the token away before any claim is read"}
  - id: Q3
    outcome: LO2
    stem: "A token's `exp` is 12:15:00. Verification takes the time from an injected clock rather than from the machine. What does that buy, and at 12:15:00 exactly is the token valid?"
    options: {A: "Nothing but speed, since reading the clock once is cheaper than reading it per request; at 12:15:00 the token is still valid because `exp` is the last valid second", B: "Protection from clock skew between servers; at 12:15:00 the token is valid for a further 30 seconds, because skew tolerance is added to `exp` by default", C: "Reproducible tokens (the same claims every time); at 12:15:00 validity depends on the time zone of the server, so the clock must be set to UTC", D: "A test can move the clock to the second before and the second of `exp` without sleeping; at 12:15:00 the token is expired, because expiry is at `exp`, not after it"}
  - id: Q4
    outcome: LO3
    stem: "Reader Bob asks for ticket 7, which belongs to Alice. What should the API answer, and why?"
    options: {A: "403 Forbidden with 'Not yours', because it tells Bob exactly what happened and a client can show him a helpful message", B: "404 Not Found with the same body as for a ticket that does not exist, because a 403 would let a caller list which ids exist", C: "401 Unauthorized, because Bob is not authorised for that ticket and the client should ask him to sign in again", D: "200 with an empty ticket, so that clients never have to handle an error and the answer reveals nothing about the other ticket"}
  - id: Q5
    outcome: LO3
    stem: "A reader sends `PATCH /tickets/7 {\"title\": \"New title\", \"status\": \"resolved\"}` on their own open ticket. Readers may edit titles; only staff may change the status. What is the right outcome?"
    options: {A: "The title is changed and the status is ignored, answering 200, so that the part the reader may do still succeeds", B: "The status is changed, because the ticket is the reader's own and ownership allows every field of it", C: "The title is changed and the answer is 403 for the status, so the client sees both facts in one response", D: "The whole request is refused with 403 and nothing is changed, so a refused change never leaves the other fields half applied"}
  - id: Q6
    outcome: LO4
    stem: "A search route binds the user's text as a parameter (`title LIKE ?` with `%` + text + `%`) and still returns every row when the user searches for `%`. A second route builds `ORDER BY ?` and binding `\"id DESC\"` leaves the order unchanged. What is the single idea behind both repairs?"
    options: {A: "Only values can be bound, and LIKE has wildcards of its own: escape the wildcards for LIKE, and take column names and directions from a fixed table, never from the client", B: "Binding is unsafe for these two cases; paste the text into the statement but escape the quotes in it and cap its length at a hundred characters so that it stays harmless", C: "Use a longer parameter so that the database cannot mistake it for a wildcard or a keyword, and keep binding every other value exactly as before", D: "Run the query twice, once with each reading of the parameter, compare the two results and return the shorter of them to be safe"}
  - id: Q7
    outcome: LO5
    stem: "A contract test asserts that the 422 answer has `\"title\": \"Unprocessable Entity\"` taken from `http.HTTPStatus(422).phrase`, and it passes on Python 3.12. After an upgrade to 3.13 it fails. What is wrong and how do you prevent it?"
    options: {A: "The test is wrong: 3.13 has a bug in `http.HTTPStatus`; the repair is to pin the previous interpreter until the bug is fixed and keep the test as it is", B: "FastAPI changed its response format in the same upgrade of the environment; pin the FastAPI version and keep the test as it is, since the contract belongs to the framework", C: "The contract is wrong: the standard library renamed 422 to 'Unprocessable Content' in 3.13, so a title taken from it changes with the interpreter; keep your own table of titles and test against it", D: "Nothing is wrong with the service, only with the test; skip the title in the contract test because clients never read it, and assert the status code alone"}
  - id: Q8
    outcome: LO6
    stem: "Which record belongs in the audit log of a ticket service?"
    options: {A: "`ticket created: 'Printer on fire, my VPN password is hunter2' by alice (Authorization: Bearer eyJ...)`", B: "`event=ticket.created ticket=7 actor=alice request_id=3f2a...` with no text a user typed and no credential", C: "The full request body, so that an incident can be replayed exactly, with the headers removed to keep the credentials out", D: "Nothing, because logging a request is a privacy risk in itself and an incident can be reconstructed from the database alone"}
