# Public rubric for the PY-M01 independent lab (logkit and report.py). Students see exactly how they are graded.
# Mechanical criteria (kind: automated) are run by instructors with the hidden test suite; judgement criteria (kind: reviewer) are scored 0-3 using the level descriptors below.
rubric_id: RUB-PY-M01
module: PY-M01
version: 0.1.0
pass_rule: >
  Every must-pass criterion is met, no reviewer criterion is scored 0, and the reviewer criteria total at least 60% of their maximum.
  Finishing the lesson or the guided lab alone is not a completion claim.
criteria:
  - id: C1
    name: "Published examples pass"
    outcomes: [LO3, LO5]
    kind: automated
    must_pass: true
    measure: "python -m pytest in lab-independent/ passes with the learner's starter/logkit.py (the examples file is run as a doctest; no skipped or xfail tests)"
  - id: C2
    name: "Hidden test suite"
    outcomes: [LO2, LO3, LO5]
    kind: automated
    must_pass: true
    measure: "the instructors' hidden suite (34 cases covering all five functions) is run against the learner's logkit.py: at least 29 of the 34 cases (85%) pass"
  - id: C3
    name: "Code clarity and structure"
    outcomes: [LO3]
    kind: reviewer
    max: 3
    levels:
      0: "Names are misleading or functions are long and tangled; the same parsing is repeated in several places."
      1: "The code works but is hard to follow: unclear names, deep nesting, or repeated blocks."
      2: "Clear names, early returns for the unusual cases, and the parsing rule written once and reused."
      3: "As 2, plus the learner can explain why each function is pure and why the chosen data structure fits."
  - id: C4
    name: "Files and text handled safely in report.py"
    outcomes: [LO4]
    kind: reviewer
    max: 3
    levels:
      0: "report.py is missing, crashes on the sample file, or prints something other than the specified summary."
      1: "Prints the specified summary but omits the encoding, leaves files open, or shows a traceback for a missing file."
      2: "Uses pathlib and an explicit UTF-8 encoding, closes the file, writes accented letters unescaped, and reports an unreadable file in one line with exit status 2."
      3: "As 2, plus IP addresses are masked in the printed messages and the learner explains what the encoding choice protects against."
  - id: C5
    name: "Method and honesty in notes.md"
    outcomes: [LO1, LO5]
    kind: reviewer
    max: 3
    levels:
      0: "No notes, or claims that the code is complete and correct without evidence."
      1: "Records the Python version, but not the order of work or any edge cases."
      2: "Records interpreter and version, the order in which examples passed, and the edge cases tested with how each was checked."
      3: "As 2, plus names specific inputs that the learner's tests and the published examples do not cover and says what could go wrong."
