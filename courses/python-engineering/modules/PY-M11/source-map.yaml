# Source-to-new-content trace for PY-M11. The original PDF content is preserved untouched; this maps what each new artefact does with it.
# disposition: REPLACED (re-authored from primary sources), RETAINED_IDEA (idea kept, text and code new), CORRECTED, DROPPED (reason given).
# Page numbers are PDF page indices in the source file (the printed page label is one lower). Mapping of pages to this module is a reading by the module author, not a measurement.
source: SRC-PY-HANDBOOK
module: PY-M11
mappings:
  - source_pages: [93, 94, 95, 96, 97]
    source_topic: "73. Real-time Python project: Log Monitoring & Alerting System - folder structure, config.py, reader.py, analyzer.py, alert.py, the summary writer and main.py"
    disposition: REPLACED
    new_content: "lesson.md sections 2 and 3 (the project executed, the characterisation method); lab-guided (the prototype, the walking skeleton); lab-independent (SPEC.md and the application `authwatch`)"
    note: "The project keeps a good idea (a reader, an analysis step, an alert step and an entry point) and fails in the details; executed on CPython 3.11 to 3.15 (F-PYH-016): 100 identical error lines raise 96 alerts because the rule is `count >= 5` for every line; `if key in line` matches substrings of prose (`RETRY_FAILED_COUNT=0`, `CRITICALITY=low`) and misses `error:` and `Failed password`; the alert time is naive local time; the summary is written into a `reports/` folder that the code does not create; `main.py` calls `write_summary` without importing it, so the program as printed ends with a `NameError`; there is no test, type, package or pipeline."
  - source_pages: [93, 98]
    source_topic: "Claims about the project: 'Reads live logs', 'Production-grade folder structure', 'could run in a SOC, a server, a DevOps environment, a cloud system'"
    disposition: CORRECTED
    new_content: "lesson.md section 2 and the specification (SPEC.md): what the tool does and does not protect; lab-independent README (the live scenario that really is a stream)"
    note: "The code reads a finished file from start to end, not a live log, and the folder layout is not a package that installs; the lesson states what the new tool protects against and what it does not (F-PYH-016)."
  - source_pages: [99]
    source_topic: "74.1 Builder pattern: `ReportBuilder` with `self.data = []` and chained setters"
    disposition: DROPPED
    new_content: "none in this module"
    note: "A builder that mutates itself and hands out its own list is the opposite of the immutable value types taught in PY-M12; `authwatch` builds a frozen `Report` in one call."
  - source_pages: [100]
    source_topic: "74.2 Adapter pattern: `LoggerAdapter` around a JSON logger"
    disposition: DROPPED
    new_content: "none in this module"
    note: "The structured logging of the capstone is a plain `logging` formatter (lesson section 7); an adapter around a class that only prints adds nothing."
  - source_pages: [100, 101]
    source_topic: "74.3 Facade pattern: one entry point over reader, analyzer and alert"
    disposition: RETAINED_IDEA
    new_content: "lesson.md section 9 (one command); lab-independent SPEC.md section 3 (the public interface) and section 7 (the command line)"
    note: "A small public surface over several internal modules is exactly the shape of the capstone: the package API and the command line are the only things the tests and the instructors may use."
  - source_pages: [101, 102]
    source_topic: "75. Writing robust Python code (pro tips) and 76. Security best practices for Python code (including `bandit` and `pip-audit`)"
    disposition: REPLACED
    new_content: "lesson.md sections 6 and 8 and the gates G06 to G11 of lab-guided/tools/gate.py"
    note: "Each bullet that can be tested is now a gate or a test: bounded reads, a safe parser, no input text in diagnostics, `ruff` with the `S` rules (the `bandit` family), a dependency check (the mechanism offline, `pip-audit` named for use with a network), pinned actions and a least-privilege token (F-PYH-016)."
