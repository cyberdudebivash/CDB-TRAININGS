# Public rubric for the PY-M11 capstone (part B, the independent lab). Students see exactly how they are graded.
# Mechanical criteria (kind: automated) are run by instructors; judgement criteria (kind: reviewer) are scored 0-3 using the level descriptors below.
rubric_id: RUB-PY-M11
module: PY-M11
version: 0.1.0
pass_rule: >
  Every must-pass criterion is met, no reviewer criterion is scored 0, and the reviewer criteria total at least 60% of their maximum.
  Finishing the lesson or part A alone is not a completion claim.
criteria:
  - id: C1
    name: "Release gate"
    outcomes: [LO2, LO3, LO4, LO5, LO6]
    kind: automated
    must_pass: true
    measure: "python lab-guided/tools/gate.py (part B, all thirteen gates) on the learner's project/ reports 13 of 13: layout, metadata, offline build, wheel contents, clean install and one version, mypy --strict, ruff with the rules of the specification, at least 30 tests with branch coverage of at least 90 percent, a pinned least-privilege workflow, a lock file without a known-bad pin, hygiene, documentation of every option, and the live scenario; the gate runs its own settings, so a weaker setting in the learner's pyproject.toml changes nothing"
  - id: C2
    name: "Hidden behavioural suite"
    outcomes: [LO3, LO4, LO5]
    kind: automated
    must_pass: true
    measure: "the instructors' hidden suite (585 checks written from SPEC.md only: parsing and the limits of every field, bounded reading and the line limit, the error budget, rules and their validation, the window arithmetic with its two edges, an oracle written from the specification and compared with detect on random streams, state that does not grow, byte-exact renderings, every option and exit status of the command line, atomic output with mode 0600, a closed pipe and Ctrl-C, no input text in any diagnostic, and a corpus of hostile input) is run against the learner's application: at least 498 of the 585 pass (85 percent), no check is skipped or xfail, and every check on bounded reads, on safe loading of rules, on the atomic restricted output file, on diagnostics without input text, on the oracle comparison and on state growth passes"
  - id: C3
    name: "The learner's own tests"
    outcomes: [LO3]
    kind: automated
    must_pass: true
    measure: "the learner's tests/ folder is copied away from the project and run (a) against the instructors' implementation, where every test must pass (a test that imports a module that SPEC.md does not name fails here, which is the reason for the rule), and (b) against defective copies of that implementation, one defect each: the suite must fail on at least 60 percent of the 312 required defects, and on every defect in the groups of window edges, line and size limits, and exit statuses"
  - id: C4
    name: "Characterisation, risk table and handover note"
    outcomes: [LO1, LO4, LO6]
    kind: reviewer
    max: 3
    levels:
      0: "No NOTES.md, or a characterisation that does not run the prototype (inputs and outputs are guessed), or a risk table that names a library instead of a rule"
      1: "A characterisation of eight rows with a decision for each, and a risk table in which several rows lack the sentence of the design that handles the risk or the check that would notice its removal, or no handover section"
      2: "A characterisation that keeps at least two behaviours and fixes at least three, each row traceable to an observed output; a risk table with ten rows, each naming the sentence of the design and a published check, a gate or a test of the learner's that would fail if the rule were removed; a handover section with which another person can run every check and knows what is not done"
      3: "As level 2, and the learner shows one risk found by attacking their own application (an input they sent, the answer they got, the change they made) and one that is only partly handled, with the residual risk and what would be needed stated"
  - id: C5
    name: "Documents and release"
    outcomes: [LO2, LO6]
    kind: reviewer
    max: 3
    levels:
      0: "A document promises something that the application does not do, or the README cannot be followed (the install command, a usage example or an exit status does not behave as written)"
      1: "Nothing is false, but the exit codes, the streams or the limits are not explained, or the pipeline and the laptop run different commands"
      2: "README and CHANGELOG are true and complete (every option, every exit status, the files written and their mode, what is logged and what never is); the pipeline runs the one command; the Security considerations section says what the tool defends against"
      3: "As level 2, and the Security considerations section says what the tool cannot protect (a log that is already forged, a reader with the same privileges, the clock of the producer, a deployment that was not tested) and the learner states which claims of the pipeline were not verified (that a pinned SHA exists, a real runner)"
