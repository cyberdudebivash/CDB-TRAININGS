    source_topic: "27. Error handling: try, except, finally; 'finally block always runs' shown with `f = open(...)`, a bare `except:` and a print"
    disposition: CORRECTED
    new_content: "lesson.md section 8 (the executed contrast with `with`)"
    note: "The example opens a file and never closes it, catches everything with a bare except (which includes KeyboardInterrupt) and uses finally for a print. Exceptions as such are taught in PY-M02; this module takes the cleanup half (F-PYH-012)."
