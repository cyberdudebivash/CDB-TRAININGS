    note: "`next` is the Python 2 method name: the built-in next() needs __next__ (executed); the class name Counter hides collections.Counter. The protocol is kept and extended with single-pass behaviour (F-PYH-012)."
  - source_pages: [37, 38]
    source_topic: "29. Generators: yield, 'faster for large datasets', infinite generator, generator comprehension"
    disposition: CORRECTED
    new_content: "lesson.md sections 3 and 4; lab-guided steps A to C; lab-independent"
