# Knowledge check for PY-M12. Questions only: the answer key is held by instructors (see courses/python-engineering/instructor/README.md).
module: PY-M12
items:
  - id: Q1
    outcome: LO1
    stem: "A class body contains `items = []` and a method `def add(self, x): self.items.append(x)`. Two instances `a` and `b` are created and `a.add(1)` is called. What is `b.items`?"
    options: {A: "An empty list: each instance has its own `items`", B: "`[1]`: the list belongs to the class and both instances see it", C: "`AttributeError`: `b` has no attribute `items` until it is assigned", D: "`[1]` only on Python versions before 3.12"}
  - id: Q2
    outcome: LO1
    stem: "Inside `__init__`, a class that keeps a counter in a class attribute `count = 0` does `self.count += 1`. After creating three instances, what is `ClassName.count`?"
    options: {A: "3", B: "1", C: "0, and each instance now has its own `count` attribute equal to 1", D: "It depends on the Python version"}
  - id: Q3
    outcome: LO2
    stem: "A dataclass `Point` is declared `@dataclass` (not frozen) with fields `x` and `y`. Which statement is true?"
    options: {A: "`Point(1, 2) == Point(1, 2)` is `True`, and `hash(Point(1, 2))` raises `TypeError`", B: "`hash(Point(1, 2))` works and equals the hash of every equal point", C: "`Point(1, 2) == Point(1, 2)` is `False` because `==` compares identity by default", D: "A dataclass cannot define `__eq__`"}
  - id: Q4
    outcome: LO2
    stem: "An object defines `__eq__` and `__hash__` from a mutable attribute `v`. It is added to a set, then `obj.v` is changed. What does `obj in the_set` return, and why?"
    options: {A: "`True`: a set remembers the object, not its hash", B: "It raises `RuntimeError` because the set was modified", C: "`True`, because `in` uses `is` first", D: "`False` in most cases: the set looks in the bucket of the new hash, and the object is stored under the old one"}
  - id: Q5
    outcome: LO3
    stem: "A constructor checks `isinstance(cents, int)` to accept whole numbers of cents. Which value passes the check although it should not be accepted?"
    options: {A: "`5.0`", B: "`\"5\"`", C: "`True`", D: "`None`"}
  - id: Q6
    outcome: LO4
    stem: "`class D(B, C)` where `B` and `C` both inherit from `A` and each defines `setup()` that calls `super().setup()`. What does `D().setup()` do?"
    options: {A: "Runs `B.setup`, then `C.setup`, then `A.setup`, each once, in method-resolution order", B: "Runs `B.setup`, then `A.setup`, and never `C.setup`", C: "Raises `TypeError` because of the diamond", D: "Runs `A.setup` twice, once for each parent"}
  - id: Q7
    outcome: LO4
    stem: "A class declares `@runtime_checkable class Speaks(Protocol): def speak(self) -> str: ...`. An object whose `speak` method requires two extra arguments is passed to `isinstance(obj, Speaks)`. What happens?"
    options: {A: "`False`: the signature is compared at runtime", B: "`TypeError`: the signature does not match", C: "`True` only if the class inherits from `Speaks`", D: "`True`: only the presence of a method named `speak` is checked; a static type checker would report the mismatch"}
  - id: Q8
    outcome: LO5
    stem: "A notifier calls each subscriber in a loop; one subscriber raises `ValueError`. The requirement is that the other subscribers still get the event and that `KeyboardInterrupt` is never hidden. Which design fits?"
    options: {A: "Wrap the whole loop in one `try/except BaseException` and log the error", B: "Call each subscriber in its own `try/except Exception`, keep the exceptions, and return or report them after the loop", C: "Let the first error propagate; the caller can call `publish` again", D: "Catch `Exception` around the loop and stop at the first error"}
