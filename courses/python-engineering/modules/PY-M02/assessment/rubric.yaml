# Public rubric for the PY-M02 independent lab (splitkit). Students see exactly how they are graded.
# Mechanical criteria (kind: automated) are measured with labs/_tools/mutation_check.py; the instructor holds the hidden mutant list.
# Judgement criteria (kind: reviewer) are scored 0-3 by a human reviewer using the level descriptors below.
rubric_id: RUB-PY-M02
module: PY-M02
version: 0.1.0
pass_rule: >
  Every must-pass criterion is met, no reviewer criterion is scored 0, and the reviewer criteria total at least 60% of their maximum.
  Finishing the lesson or the guided lab alone is not a completion claim.
criteria:
  - id: C1
    name: "Tests pass on the correct module"
    outcomes: [LO1]
    kind: automated
    must_pass: true
    measure: "mutation_check.py: the learner's test suite passes on starter/splitkit.py (exit 0, no skipped or xfail tests)"
  - id: C2
    name: "Defects detected"
    outcomes: [LO2, LO3, LO4, LO5]
    kind: automated
    must_pass: true
    measure: "mutation_check.py with the hidden mutants: at least 10 of the 12 required mutants are killed"
  - id: C3
    name: "Boundary and invalid-input coverage by design"
    outcomes: [LO2, LO3]
    kind: reviewer
    max: 3
    levels:
      0: "Only happy-path examples, or tables that repeat the same kind of input."
      1: "Some boundaries or some invalid inputs, chosen without a stated method."
      2: "Value on each side of every boundary and one row per kind of invalid input, in parametrised tables."
      3: "As 2, plus the learner explains why each row exists and which contract sentence it protects."
  - id: C4
    name: "Readability and failure messages"
    outcomes: [LO1]
    kind: reviewer
    max: 3
    levels:
      0: "Test names and structure make failures hard to interpret."
      1: "Names are meaningful, but several behaviours are asserted in one test."
      2: "One behaviour per test, sentence-style names, exceptions checked with match=."
      3: "As 2, plus data tables are readable and a failing row identifies the broken contract sentence."
  - id: C5
    name: "Honesty about limits"
    outcomes: [LO5]
    kind: reviewer
    max: 3
    levels:
      0: "Claims the suite is complete without evidence."
      1: "Mentions limits in general terms."
      2: "Lists specific behaviours the suite does not check and why."
      3: "As 2, plus names mutants the learner expects to survive and justifies each with the contract."
