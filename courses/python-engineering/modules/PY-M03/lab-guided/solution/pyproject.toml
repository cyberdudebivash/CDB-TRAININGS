[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "invkit"
dynamic = ["version"]
requires-python = ">= 3.11"
dependencies = []

[project.scripts]
invkit = "invkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "invkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invkit = ["py.typed"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
