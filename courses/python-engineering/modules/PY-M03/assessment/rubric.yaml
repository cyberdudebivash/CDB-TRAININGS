# Public rubric for the PY-M03 independent lab (fleetlog). Students see exactly how they are graded.
# Mechanical criteria (kind: automated) are measured by running ../lab-independent/checks (pytest); judgement criteria are scored 0-3 by a reviewer.
rubric_id: RUB-PY-M03
module: PY-M03
version: 0.1.0
pass_rule: >
  Every must-pass criterion is met, no reviewer criterion is scored 0, and the reviewer criteria total at least 60% of their maximum.
  Finishing the lesson or the guided lab alone is not a completion claim.
criteria:
  - id: C1
    name: "Strict typing without silencing"
    outcomes: [LO1, LO2]
    kind: automated
    must_pass: true
    measure: "checks: test_mypy_strict_is_clean_for_package_and_tests and test_errors_are_fixed_not_silenced pass (no type: ignore, cast or Any)"
  - id: C2
    name: "Structure and one-way dependencies"
    outcomes: [LO3, LO4]
    kind: automated
    must_pass: true
    measure: "checks: test_legacy_flat_modules_are_gone, test_package_has_one_module_per_idea, test_no_circular_imports_between_modules, test_public_interface_is_declared and test_modules_are_documented pass"
  - id: C3
    name: "Behaviour matches the specification"
    outcomes: [LO2, LO3]
    kind: automated
    must_pass: true
    measure: "checks: every test in test_behaviour.py passes (exact Decimal arithmetic, half-up rounding, validation, ordering, command line)"
  - id: C4
    name: "Configuration and tests"
    outcomes: [LO4, LO5]
    kind: automated
    must_pass: true
    measure: "checks: test_pyproject_configures_strict_mypy_and_pytest and test_tests_live_outside_the_package_and_pass pass; at least three tests in tests/"
  - id: C5
    name: "Explanation of each fix"
    outcomes: [LO2, LO3]
    kind: reviewer
    max: 3
    levels:
      0: "No explanation, or the explanation contradicts the code."
      1: "Lists the mypy errors that were fixed without saying why they were real problems."
      2: "For each class of error and for the import cycle, says what could have gone wrong at run time and how the change prevents it."
      3: "As 2, plus identifies a defect that the types alone would not have revealed and says how it was found."
  - id: C6
    name: "Honesty about limits"
    outcomes: [LO1, LO5]
    kind: reviewer
    max: 3
    levels:
      0: "Claims the code is correct because mypy passes."
      1: "Mentions that tests and types are different checks."
      2: "Names behaviour the tests do not cover and one kind of error the checker cannot see."
      3: "As 2, plus says how the checks would run in continuous integration and on another Python version."
