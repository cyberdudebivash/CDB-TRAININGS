# Source-to-new-content trace for PY-M03. The original PDF content is preserved untouched; this maps what each new artefact does with it.
# disposition: REPLACED (re-authored from primary sources), RETAINED_IDEA (idea kept, text and code new), CORRECTED, DROPPED (reason given).
# Page numbers are PDF page indices in the source file (the printed page label is one lower).
source: SRC-PY-HANDBOOK
module: PY-M03
mappings:
