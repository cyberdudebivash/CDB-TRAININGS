    disposition: CORRECTED
    new_content: "lesson.md sections 2, 3, 4 and 9; guided lab; quiz Q1, Q2 and Q3"
    note: "Finding F-PYH-008: dataclasses perform no run-time type validation (executed); type hints detect bugs only through a checker. mypy --strict and fix-the-cause practice replace the four-line example."
