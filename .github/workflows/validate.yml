# Manual-only validation workflow. It never runs on push or pull request, so it cannot consume build minutes
# unless an authorised person starts it (project policy: no unapproved build charges).
# Third-party actions are referenced by major tag; pin to commit SHAs before relying on this in a production pipeline.
name: validate-repository
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fail closed on known public-source exposure
        run: python scripts/validation/check_public_source_exposure.py
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Catalog and program documents
        run: |
          python scripts/validation/validate_catalog.py
          python scripts/build/render_program_docs.py --check
      - name: Test suite
        run: pytest
