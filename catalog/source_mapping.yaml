# Source-page -> destination-module mapping rules (single source of truth for docs/qa/COURSE_SOURCE_TRACEABILITY.md).
#
# How a page is mapped: scripts/audit/build_page_records.py builds a heading path "chapter > lesson > topic" for every page
# from the PDF bookmarks, lower-cases it, and applies the FIRST matching rule below. A page that matches no rule uses the
# source's `default`. The mapping is HEURISTIC: every record keeps mapping_basis (rule id or default) so a reviewer can see
# why a page landed where it did, and the traceability report states how many pages used only the default.
#
# module:  a module id from catalog/courses.yaml, or `~` (null) for content that has NO destination (out of portfolio scope,
#          marketing, or career coaching). Such pages are not deleted from the source PDF; they are simply not carried into
#          the new curriculum (action REMOVE).
# action:  the default modernization action when no currency/security issue overrides it
#          (UPDATE, MERGE, REPLACE, EXPAND, REMOVE, KEEP).
schema_version: 1
sources:
  SRC-PY-HANDBOOK:
    course: COURSE-PY-ENG
    default: {module: PY-M01, action: UPDATE}
    container_defaults:   # used only when no keyword rule matched; keyed on the VOLUME/MODULE/PHASE heading
      - {id: C-PYH-1, rx: '^module 1\b', module: PY-M01, action: UPDATE}
      - {id: C-PYH-2, rx: '^module 2\b', module: PA-M02, action: UPDATE}
      - {id: C-PYH-3, rx: '^module 3\b', module: PY-M10, action: UPDATE}
      - {id: C-PYH-4, rx: '^module 4\b', module: SOC-M03, action: UPDATE}
      - {id: C-PYH-5, rx: '^module 5\b', module: PA-M05, action: UPDATE}
      - {id: C-PYH-6, rx: '^module 6\b', module: ~, action: REMOVE}
      - {id: C-PYH-7, rx: '^module 7\b', module: AI-M01, action: UPDATE}
      - {id: C-PYH-8, rx: '^module 8\b', module: GCP-M02, action: UPDATE}
    rules:
      - {id: M-PYH-00, rx: '(?:^|> )(?:31\. object-oriented|31\.\d+ |35\.\d+ |45\.[1-5] |instance variables|python follows mro|factory pattern|observer pattern|strategy pattern|singleton pattern)', module: PY-M12, action: UPDATE, note: "Classes, dataclasses and object-oriented design: the chapter was mapped to PY-M01 by the container default, which hid that no module taught it (DEF-006)."}
