      - {course: COURSE-PY-ENG, modules: [PY-M01, PY-M02, PY-M05, PY-M07]}
      - {course: COURSE-AI-ENG, modules: [AI-M01, AI-M02, AI-M03, AI-M05, AI-M07, AI-M08, AI-M09, AI-M10]}
      - {course: COURSE-CYBER-MEGA, modules: [CYB-M13]}
    capstone_module: AI-M07
  - id: PATH-DATA-ENGINEER-GCP
    title: "Data engineer (Google Cloud)"
    audience: "Data and software engineers building pipelines on Google Cloud"
    steps:
