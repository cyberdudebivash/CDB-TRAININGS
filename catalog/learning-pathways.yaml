# Competency levels and learner pathways -- single source of truth for sequencing across courses.
# Rendered into docs/curriculum/COMPETENCY_PATHWAYS.md by scripts/build/render_program_docs.py and
# validated by scripts/validation/validate_catalog.py (ids exist, prerequisites precede, no empty pathways).
#
# Levels describe LEARNING EVIDENCE inside this academy. They are not job titles, salary bands, or
# equivalence claims to any external certification.
schema_version: 1
levels:
  - id: 0
    name: "Foundations"
    descriptor: "Completes guided tasks in a safe, prepared environment by following written steps."
    evidence: "Automated checks pass on small guided exercises; learner can restate what each step did."
    supervision: "Every task is scaffolded; learner is expected to ask for help."
  - id: 1
    name: "Guided practitioner"
    descriptor: "Performs routine tasks from a documented procedure and recognises when a result looks wrong."
    evidence: "Rubric-scored short artefacts (a parsed log, a unit-tested function, a defect report) built from provided starters."
    supervision: "Output is reviewed before it is relied on."
  - id: 2
    name: "Independent practitioner"
    descriptor: "Completes standard tasks without a starter, justifies trade-offs, and validates their own work against data or tests."
    evidence: "Independent labs graded by automated checks plus a rubric; learner measures precision/recall, coverage or runtime rather than asserting them."
    supervision: "Self-checked; periodic review."
  - id: 3
    name: "Advanced practitioner"
    descriptor: "Handles ambiguous, multi-step problems that cross domains; designs, evaluates and documents solutions for others to use."
    evidence: "Capstone with a reproducible repository or case file, a written decision record, and an evaluation against stated acceptance criteria."
    supervision: "Reviews others' work; owns outcomes."

pathways:
  - id: PATH-SOC-ANALYST
    title: "SOC analyst"
    audience: "Learners aiming at Tier-1/Tier-2 security-operations work"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-PY-ENG, modules: [PY-M01, PY-M02], note: "Python needed for the detection and triage labs"}
      - {course: COURSE-SOC}
    capstone_module: SOC-M14
  - id: PATH-DETECTION-ENGINEER
    title: "Detection engineer"
    audience: "SOC analysts moving to detection engineering"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-PY-ENG, modules: [PY-M01, PY-M02, PY-M03, PY-M04]}
      - {course: COURSE-SOC, modules: [SOC-M02, SOC-M03, SOC-M04, SOC-M06, SOC-M07, SOC-M09]}
      - {course: COURSE-CYBER-MEGA, modules: [CYB-M10, CYB-M11]}
    capstone_module: CYB-M11
  - id: PATH-PYTHON-ENGINEER
    title: "Python engineer"
    audience: "Developers and analysts who need production-quality Python"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-PY-ENG}
    capstone_module: PY-M11
  - id: PATH-AUTOMATION-ENGINEER
    title: "Automation engineer (Python)"
    audience: "Operations, QA and security staff automating repeatable work"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-PY-ENG, modules: [PY-M01, PY-M02, PY-M13, PY-M03, PY-M12, PY-M04, PY-M05, PY-M08, PY-M09, PY-M10]}
      - {course: COURSE-PY-AUTO}
    capstone_module: PA-M10
  - id: PATH-TEST-AUTOMATION-JAVA
    title: "Test automation engineer (Java)"
    audience: "Manual testers and Java developers moving into test automation"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-JAVA-QA}
    capstone_module: JQA-M10
  - id: PATH-AI-ENGINEER
    title: "Applied AI / LLM engineer"
    audience: "Engineers building LLM-based applications"
    steps:
      - {course: COURSE-FND-DIGITAL}
      - {course: COURSE-PY-ENG}
