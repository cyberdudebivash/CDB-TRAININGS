      - {id: PY-M02, title: "Functions, errors and testing with pytest", level: 1, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Write parametrised pytest tests that detect three seeded defects in a provided module."}
      - {id: PY-M13, title: "Iterators, generators, closures, decorators and context managers", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Build a lazy stream-processing toolkit whose generators, decorators and context managers consume only what they need and release every resource on every path, verified by tests that count consumption."}
      - {id: PY-M03, title: "Types, modules and project layout", level: 2, status: BUILT, estimated_hours: 6, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Refactor a script into a typed package that passes a static type checker without errors."}
      - {id: PY-M12, title: "Classes, dataclasses and object-oriented design", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Model a small domain with frozen value types, per-instance state, injected behaviour and an event bus, and keep every rule true under a hidden suite that tests equality, immutability, isolation and refusal."}
      - {id: PY-M04, title: "Environments, dependencies and packaging (pyproject, build)", level: 2, status: BUILT, estimated_hours: 6, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Build, install and import a wheel produced with python -m build in a clean virtual environment."}
      - {id: PY-M05, title: "Files, structured data and HTTP clients", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Consume a paginated API fixture with retries and timeouts and validate every response against a schema."}
      - {id: PY-M06, title: "Concurrency and asynchronous programming", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Reduce the runtime of an I/O-bound job with asyncio and prove the speed-up with a benchmark."}
      - {id: PY-M07, title: "Secure coding for Python", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Find and fix eight seeded vulnerabilities (injection, secrets, TLS, deserialisation) and add a regression test for each."}
      - {id: PY-M08, title: "Databases and persistence: safe SQL, transactions, repositories, migrations and query cost", level: 2, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Implement a repository layer using parameterised SQL, a versioned schema and atomic writes, and demonstrate that an injection attempt, a retry and a concurrent edit do not corrupt the data."}
      - {id: PY-M09, title: "Profiling, performance and maintainable architecture", level: 3, status: BUILT, estimated_hours: 8, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Identify the dominant bottleneck of a slow program with a profiler and cut its runtime by at least 30 percent without changing an answer, and prove it with tests that do not depend on the speed of the machine."}
      - {id: PY-M10, title: "API development: typed, tested and secure HTTP services", level: 2, status: BUILT, estimated_hours: 10, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Build a typed HTTP API with request validation and authentication that passes contract tests and an injection test suite, and a multi-tenant API that survives a hidden review suite."}
      - {id: PY-M11, title: "Capstone: typed, tested, documented application with CI", level: 3, status: BUILT, estimated_hours: 14, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Deliver a packaged application whose tests, type checks and security scan pass in a clean environment, whose behaviour passes a hidden suite and whose own tests detect seeded defects."}
