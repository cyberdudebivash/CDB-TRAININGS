# CDB Academy course catalog -- single source of truth for course identity, structure and release state.
# Validated by scripts/validation/validate_catalog.py against catalog/schema/course-catalog.schema.json.
#
# Conventions
#   * estimated_duration_hours / estimated_hours are PLANNING ESTIMATES, not measured learner times.
#   * release_status uses the Gate A states from docs/release/RELEASE_GATES.md. TRAINING_CONTENT_GO is computed by scripts/production/gate_a.py and no course has it; commercial and Academy readiness are separate, unassessed gates.
#   * lifecycle says how far the replacement content has progressed; release_status says whether it may ship.
#   * lab_coverage.verified_executable counts only labs whose automated check passed in the recorded QA run.
#   * blocking_findings must list EVERY P0/P1 finding against the course's sources until the course is fully rebuilt (lifecycle VALIDATED);
#     a fix in one pilot module (remediation DONE_IN_PILOT) does not clear a finding for the whole course.
#   * lab_coverage.planned follows the module unit contract: a guided and an independent lab per module, one lab for a capstone module.
schema_version: 1
catalog_version: 0.1.0
last_verified: 2026-10-14

