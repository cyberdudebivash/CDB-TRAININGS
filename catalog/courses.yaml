  # ------------------------------------------------------------------ Remaining source-derived courses (blueprint only)
  - id: COURSE-PY-ENG
    slug: python-engineering
    title: "Python Engineering Pathway"
    version: 0.1.0-build
    source_ids: [SRC-PY-HANDBOOK]
