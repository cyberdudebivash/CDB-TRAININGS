  # ------------------------------------------------------------------ SOC analyst (pilot course)
  - id: COURSE-SOC
    slug: soc-analyst
    title: "SOC Analyst Professional Pathway"
    version: 0.1.0-pilot
    source_ids: [SRC-SOC-PLAYBOOK]
    audience: ["Aspiring Tier-1/Tier-2 SOC analysts", "IT staff moving into security operations", "Teams standardising triage and detection practice"]
    competency_levels: [1, 2, 3]
    prerequisites: [COURSE-FND-DIGITAL]
    modules:
      - {id: SOC-M01, title: "SOC fundamentals, roles and the alert lifecycle", level: 1, status: PLANNED, estimated_hours: 4, primary_outcome: "Explain the alert lifecycle and map each stage to the role and artefact responsible for it."}
      - {id: SOC-M02, title: "Telemetry: Windows, Linux and network logs", level: 1, status: PLANNED, estimated_hours: 8, primary_outcome: "Identify the log source and event ID or field that evidences a given behaviour in Windows, Linux and network data."}
      - {id: SOC-M03, title: "Log parsing, normalisation and query languages", level: 1, status: PLANNED, estimated_hours: 8, primary_outcome: "Parse a raw log sample into a normalised schema and answer five investigative questions with queries."}
      - {id: SOC-M04, title: "Authentication-attack detection and triage", level: 2, status: BUILT_PILOT, estimated_hours: 6, lab_state: VERIFIED_EXECUTABLE, primary_outcome: "Build and validate detections for brute-force and password-spray activity and triage the resulting alerts with documented evidence.", reuses: [SOC-M02]}
      - {id: SOC-M05, title: "Alert triage and case management", level: 2, status: PLANNED, estimated_hours: 6, primary_outcome: "Triage a queue of ten synthetic alerts, classify each with evidence and produce a handover record."}
      - {id: SOC-M06, title: "Detection engineering with Sigma and ATT&CK", level: 2, status: PLANNED, estimated_hours: 10, primary_outcome: "Author a Sigma rule mapped to an ATT&CK technique and demonstrate its precision and recall on labelled data."}
      - {id: SOC-M07, title: "Threat-intelligence enrichment and false-positive reduction", level: 2, status: PLANNED, estimated_hours: 6, primary_outcome: "Reduce false positives of a noisy rule by at least 50 percent without losing any true-positive scenario."}
      - {id: SOC-M08, title: "Incident investigation and evidence handling (NIST SP 800-61r3 / CSF 2.0)", level: 2, status: PLANNED, estimated_hours: 8, primary_outcome: "Reconstruct an incident timeline from multi-source evidence and map actions to CSF 2.0 functions."}
      - {id: SOC-M09, title: "Threat hunting", level: 3, status: PLANNED, estimated_hours: 8, primary_outcome: "Plan and execute a hypothesis-driven hunt against a dataset and report negative and positive findings."}
      - {id: SOC-M10, title: "Malware-analysis fundamentals in an isolated lab", level: 3, status: PLANNED, estimated_hours: 8, primary_outcome: "Perform static triage of a safe benign sample in an isolated VM and document indicators with confidence levels."}
      - {id: SOC-M11, title: "Executive and technical incident reporting", level: 3, status: PLANNED, estimated_hours: 4, primary_outcome: "Write an executive summary and a technical appendix for one incident that pass the reporting rubric."}
      - {id: SOC-M12, title: "Cloud and identity threat detection", level: 3, status: PLANNED, estimated_hours: 8, primary_outcome: "Detect and triage a synthetic identity-compromise and cloud-misuse scenario using normalised cloud audit logs."}
      - {id: SOC-M13, title: "SOAR playbooks and AI-assisted investigation automation", level: 3, status: PLANNED, estimated_hours: 8, primary_outcome: "Implement a playbook that enriches and routes alerts with a human approval gate and measure its effect on triage time on labelled alerts."}
      - {id: SOC-M14, title: "Capstone: end-to-end SOC investigation", level: 3, status: PLANNED, estimated_hours: 12, primary_outcome: "Investigate a multi-stage synthetic intrusion, improve one detection and deliver an evidence-based incident report."}
    estimated_duration_hours: 104
