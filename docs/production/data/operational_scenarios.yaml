# Inventory of the customer-operations scenarios each course must teach (directive section 9) and what exists for them.
#
# classification (how "real-time" the scenario is - never overstated):
#   REPLAY_SIMULATION  previously prepared events replayed to mimic operational conditions
#   CONTROLLED_LIVE    events produced while the lab runs, by a service the lab itself starts (loopback server, event generator) in an authorised environment
#   EXTERNAL_LIVE      a real authorised external service or customer-approved system (none exists; none may be used without approval)
#   NONE_YET           nothing built
# status: NOT_STARTED | IN_PROGRESS | IMPLEMENTED_UNVERIFIED | TECHNICALLY_VERIFIED
#   TECHNICALLY_VERIFIED needs: a classification other than NONE_YET, at least one failure injection, and `evidence` that names tests which the lab matrix executes.
# lifecycle steps recorded when covered (directive section 7): requirement, design, implementation, execution, observation, troubleshooting, security_validation, reporting, handoff
schema_version: 1
as_of: 2026-10-15
realtime_minimum_per_course: 1     # each course needs at least one time-dependent scenario classified CONTROLLED_LIVE or REPLAY_SIMULATION that passes the status rule above
scenarios:
  # ---------------------------------------------------------------- Python Engineering (directive 9.3)
  - {id: PYE-01, course: COURSE-PY-ENG, title: "Production-style application components (typed package with a checked layout)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M03, PY-M11], lifecycle: [requirement, design, implementation, execution, security_validation, reporting, handoff], failure_injections: ["a damaged project for each of the thirteen release gates (a build backend that does not exist, a missing typing marker, the version in two places, a type error, a blanket suppression, a pull_request_target workflow, an action pinned to a tag, a locked version with a known advisory, a credential in the source)", "an empty project and a walking skeleton presented as finished"], evidence: [test_m11_guided_every_gate_has_a_negative_control, test_m11_guided_gate_passes_nothing_on_an_empty_project, test_m11_guided_part_a_solution_passes_the_part_a_gate_and_is_not_a_finished_application, test_m11_independent_reference_passes_published_hidden_and_gate], note: "controlled live: the release gate builds the wheel, installs it into a scratch environment and runs the installed application against a generated stream; nothing external is used"}
  - {id: PYE-02, course: COURSE-PY-ENG, title: "Fault-tolerant API client (timeouts, bounded retries, Retry-After, pagination, same-origin links)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M05], lifecycle: [requirement, implementation, execution, observation, troubleshooting, security_validation, reporting, handoff], failure_injections: ["503 and 429 with Retry-After", "slow responses", "dropped connections", "endless and cross-origin next links", "oversized bodies"], evidence: [test_m05_guided_solution_passes_every_check, test_m05_independent_reference_passes_published_and_hidden_checks], note: "loopback server started by the lab; deadline and measured timing in hidden suite"}
  - {id: PYE-03, course: COURSE-PY-ENG, title: "Data validation at the boundary (schemas, quarantine of bad records, reject threshold)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M05], lifecycle: [requirement, implementation, execution, observation, troubleshooting, reporting], failure_injections: ["invalid items", "duplicate items", "schema drift"], evidence: [test_m05_independent_reference_passes_published_and_hidden_checks]}
  - {id: PYE-04, course: COURSE-PY-ENG, title: "Structured logging for diagnosis", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M11], lifecycle: [implementation, execution, observation, troubleshooting, security_validation], failure_injections: ["unusable lines, events out of order, a byte-order mark and Windows line endings in a generated live stream", "a closed output pipe", "Ctrl-C", "a corrupt archive", "input text that must never reach a log line"], evidence: [test_m11_independent_reference_passes_published_hidden_and_gate], note: "authwatch -v writes one JSON object per line to standard error and no character of the input; the live scenario of the release gate (G13) and the hidden suite check it; no external system is involved"}
  - {id: PYE-05, course: COURSE-PY-ENG, title: "Package maintenance (migrate a legacy project to pyproject, build, install, verify)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M04, PY-M11], lifecycle: [implementation, execution, troubleshooting, reporting], failure_injections: ["a legacy project that still builds from setup.py and requirements files and must fail exactly the modernisation checks", "a wheel that carries the tests or lacks the package", "a clean virtual environment that has none of the packages of the development environment, so only the installed copy can run", "a damaged copy of the capstone for each of the build, wheel-contents and clean-install gates"], evidence: [test_m04_guided_solution_passes_every_check, test_m04_guided_legacy_starter_fails_exactly_the_modernisation_checks, test_m04_independent_starter_fails_until_the_packaging_is_written, test_m11_guided_every_gate_has_a_negative_control]}
  - {id: PYE-06, course: COURSE-PY-ENG, title: "Automated tests that catch seeded defects (mutation-graded)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M02], lifecycle: [implementation, execution, troubleshooting, reporting], failure_injections: ["seeded defects (mutants)"], evidence: [test_m02_guided_reference_tests_kill_every_mutant]}
  - {id: PYE-07, course: COURSE-PY-ENG, title: "Secure application configuration (secrets, defaults, token validation)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M07, PY-M10], lifecycle: [implementation, execution, troubleshooting, security_validation, reporting], failure_injections: ["a weak, short or mistyped signing secret at start-up", "a token with alg none, another algorithm, the wrong audience, a tampered signature or an exact-boundary expiry", "a secret or token that must never reach a log line or an error", "eight seeded vulnerabilities in a working program, among them secrets in source and unchecked TLS"], evidence: [test_m07_guided_solution_passes_every_check, test_m07_guided_starter_works_but_is_vulnerable_in_all_eight_areas, test_m10_guided_solution_passes_every_check, test_m10_guided_starter_fails_everything_a_learner_has_to_write, test_m10_independent_reference_passes_published_and_hidden_checks]}
  - {id: PYE-08, course: COURSE-PY-ENG, title: "Concurrency: bounded fan-out, supervision, cancellation, partial failure, deadline", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M06], lifecycle: [requirement, implementation, execution, observation, troubleshooting, reporting, handoff], failure_injections: ["failing jobs", "slow jobs and timeouts", "cancellation", "dropped connections", "blocking calls"], evidence: [test_m06_guided_solution_passes_every_check, test_m06_independent_reference_passes_published_and_hidden_checks]}
  - {id: PYE-09, course: COURSE-PY-ENG, title: "Performance debugging with a profiler", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M09], lifecycle: [requirement, implementation, execution, observation, troubleshooting, reporting], failure_injections: ["a quadratic algorithm behind a plausible loop", "an unbounded cache", "a performance test that must not flake on a loaded machine"], evidence: [test_m09_guided_solution_passes_every_check, test_m09_independent_reference_passes_published_and_hidden_checks], note: "the profile is produced live by running the lab program; the budgets use counts and ratios, not wall-clock thresholds alone"}
  - {id: PYE-10, course: COURSE-PY-ENG, title: "Failure-handling patterns (retry, fallback, atomic output, no half-written files)", status: TECHNICALLY_VERIFIED, classification: CONTROLLED_LIVE, modules: [PY-M05, PY-M06], lifecycle: [implementation, execution, troubleshooting, reporting], failure_injections: ["replace failure mid-write", "failed page leaves previous output untouched"], evidence: [test_m05_guided_solution_passes_every_check, test_m06_guided_solution_passes_every_check]}
