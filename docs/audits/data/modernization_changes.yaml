     reason: "A chapter that teaches an API without authentication, validation or tests, and treats the security of the result as a list of nouns, leaves the learner able to build something that works and cannot be defended; the catalog also lacked a module that assessed it (DEF-018).", ref: [F-PYH-015, F-PYH-002, R-100, R-018, probe:pyjwt-decode-algorithms, probe:fastapi-on-event], implemented: {modules: [PY-M10], status: BUILT}, learner_impact: "Learners build a ticket API and a multi-tenant inventory API that pass contract tests, an injection suite and a hidden review suite, and can say for each rule which attack it stops.", verification: {status: EXECUTED, result: "PY-M10 lesson blocks, guided and independent labs executed on CPython 3.11-3.15 (tests/test_python_engineering_labs.py and the lab matrix)"}}
  - {id: MC-PYH-26, course: COURSE-PY-ENG, source: SRC-PY-HANDBOOK, pages: "93-106, 645-654", concept: "Capstone: a log monitor with no specification, tests, package or pipeline, and closing chapters made of bullet lists, interview questions and link lists", action: REPLACE,
