  # ------------------------------------------------------------------------- Python Engineering Handbook
  - id: F-PYH-001
    source_id: SRC-PY-HANDBOOK
    severity: P0
    dimension: technical_correctness
    title: "Agent 'math tool' evaluates model-controlled input with eval()"
    evidence:
      - {page: 585, note: "`def math_tool(expr): return eval(expr)` in the agent tools example; no warning."}
      - {page: 586, note: "'This is how ChatGPT Agents run.' (unsupported)."}
    verification: MANUAL_READ
    reference: [R-009]
    detail: "eval on LLM output is remote code execution through prompt injection (OWASP LLM05 Improper Output Handling / LLM06 Excessive Agency). It is taught as a pattern in a course that markets AI security."
    recommendation: "Replace with a restricted expression parser (e.g., ast-based allowlist) and teach the failure mode with a test."
