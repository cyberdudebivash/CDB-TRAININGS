  # ------------------------------------------------------------------------- OSINT Starter Bundle
  - id: F-OSINT-001
    source_id: SRC-OSINT-STARTER
    severity: P1
    dimension: practical_effectiveness
    title: "Document is a marketing brochure for a bundle, not a course; promised components are absent"
    evidence:
      - {page: 6, note: "Tools 'preinstalled, configured, optimized' (Maltego CE, theHarvester, SpiderFoot HX, Recon-ng, Sherlock, ExifTool)."}
      - {page: 7, note: "Preconfigured OSINT VM, one-click workflows, auto-report generation."}
      - {page: 8, note: "'OSINT Playbook (PDF, 300+ Pages)'; video tutorials and hands-on labs on p. 9; cheat sheets on p. 10; daily CVE feeds on pp. 10-11; Splunk/ELK dashboards on p. 11; Python launcher on pp. 12-13."}
      - {page: 22, note: "'The blog post itself includes affiliate-style hooks throughout' - the text is a blog/SEO draft."}
    verification: VISUAL_REVIEW
    detail: "All 23 pages were read. There are no learning outcomes, no step-by-step lab, no dataset, no assessment and no legal framework. None of the described VM, playbook, videos, dashboards, feeds or launcher exist in this repository."
    recommendation: "Treat the PDF as a product-concept brief. Build a real OSINT course from the mandate (docs/architecture/MASTER_CURRICULUM_BLUEPRINT.md) and do not advertise the bundle components until they exist and are verified."
    remediation: {status: PLANNED_IN_TRACK, where: "Track OSINT-1..OSINT-4"}
  - id: F-OSINT-002
    source_id: SRC-OSINT-STARTER
    severity: P0
    dimension: commercial_readiness
    title: "Proposes redistributing third-party tools under a 'CyberDudeBivash proprietary license'"
    evidence:
      - {page: 7, note: "'Branded & Secure -> Licensed under the CyberDudeBivash proprietary license'."}
      - {page: 14, note: "'distributed under a CyberDudeBivash proprietary license ... Verified Integrity'."}
      - {page: 6, note: "Preinstalled tools named: theHarvester, Recon-ng, Sherlock, Maltego CE, SpiderFoot HX, ExifTool."}
    verification: PRIMARY_SOURCE
    reference: [R-013]
    detail: >-
      theHarvester is GPL-2.0-only, recon-ng is GPL-3.0 and Sherlock is MIT (repository pages). Copyleft components cannot
      be relicensed as proprietary, and Maltego CE / SpiderFoot HX terms were not checked (NEEDS_VERIFICATION).
      This is a licensing/legal blocker for any VM or bundle distribution. Not legal advice; counsel review required.
    recommendation: "Do not ship a bundled VM until each component's licence and redistribution terms are reviewed; prefer install scripts that fetch tools from upstream."
    remediation: {status: NOT_STARTED, where: "docs/audits/IP_AND_LICENSE_REVIEW.md (open action)"}
  - id: F-OSINT-003
    source_id: SRC-OSINT-STARTER
    severity: P0
    dimension: technical_correctness
    title: "No lawful/ethical collection framework; instructs correlation with leaked data and alias tracking"
    evidence:
      - {page: 9, note: "Social Media Recon lab: 'Cross-reference with leaked data dumps'."}
      - {page: 11, note: "'Cross-reference with dark web leak feeds' to find exposed employee credentials."}
      - {page: 7, note: "'Track a Cybercriminal Alias' with Sherlock; p. 19 'Track online aliases across platforms'."}
      - {page: 14, note: "Bug-bounty scenario: 'focus on exploiting findings'; p. 18 'cashing out rewards'."}
      - {page: 5, note: "Legal and ethics are reduced to 'some data sources may fall into gray areas'."}
    verification: VISUAL_REVIEW
    detail: "No consent, scope, authorisation, data-protection (e.g., GDPR/DPDP) or evidence-handling rules are taught, contrary to the course mandate for lawful, privacy-preserving OSINT."
    recommendation: "Rebuild around synthetic cases and consented subjects; teach scoping, legal basis, minimisation and a prohibited-activities list before any tool use."
