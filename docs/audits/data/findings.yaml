# Findings register -- single source of truth for audit defects.
#
# Page numbers are PDF page indices (1-based). Printed page labels in the PDFs are usually one lower.
# severity:    P0 dangerous / materially incorrect / legally problematic / unusable
#              P1 major competency, reproducibility, assessment or commercial release blocker
#              P2 significant educational or experience deficiency
#              P3 minor improvement          P4 cosmetic
# dimension:   technical_correctness | practical_effectiveness | professional_outcomes | assessment_validity |
#              instructional_clarity | technical_currency | accessibility_experience | commercial_readiness
# verification: PRIMARY_SOURCE (checked against the primary document) | EXECUTED (reproduced by running code) |
#              VISUAL_REVIEW (page rendered and read) | MANUAL_READ (text read in context) |
#              STATIC_SCAN (deterministic scan, triaged) | NEEDS_VERIFICATION (suspected, unproven)
# remediation.status: NOT_STARTED | DONE_IN_PILOT | PLANNED_IN_TRACK
# The findings describe the SOURCE PDFs. A finding is only closed when replacement content passes its gate.
findings:
  # ------------------------------------------------------------------------- SOC Analyst Survival Playbook
  - id: F-SOC-001
    source_id: SRC-SOC-PLAYBOOK
    severity: P1
    dimension: technical_correctness
    title: "Six-phase IR lifecycle attributed to NIST SP 800-61 Rev. 3 / Rev. 2"
    evidence:
      - {page: 6, note: "Summary section says 'Follow NIST SP 800-61r3 (2025 update) phases' then lists 6 phases."}
      - {page: 30, note: "Detail section says r3 has no rigid lifecycle, then says 'we stick to the classic 6 phases (inspired by r2...)'."}
    verification: PRIMARY_SOURCE
    reference: [R-001]
    detail: >-
      NIST SP 800-61r3 defines no phase list; it organises incident response around the six CSF 2.0 Functions.
      Rev. 2 had four phases (Table 1 of r3). The six-step model is a common practitioner model, not NIST's.
      The two sections of the PDF contradict each other.
    recommendation: "Describe r3 as CSF-2.0-Function based; present Preparation-Identification-Containment-Eradication-Recovery-Lessons as a practitioner model and cite its actual origin."
    remediation: {status: DONE_IN_PILOT, where: "courses/soc-analyst/lessons/m04-auth-detection/lesson.md (IR framing note)"}
  - id: F-SOC-002
    source_id: SRC-SOC-PLAYBOOK
    severity: P2
    dimension: technical_currency
    title: "CSF 1.1 category code 'RS.RP' cited as a CSF 2.0 subcategory"
    evidence:
      - {page: 30, note: "'outcomes mapped to CSF subcategories (e.g., RS.RP for response planning)'."}
    verification: PRIMARY_SOURCE
    reference: [R-002]
    detail: "CSF 2.0 Respond categories are RS.MA, RS.AN, RS.CO, RS.MI; the string RS.RP does not appear in CSWP 29."
    recommendation: "Use RS.MA/RS.AN/RS.CO/RS.MI and name the CSF version."
    remediation: {status: NOT_STARTED, where: "Track SOC-4 (IR module)"}
  - id: F-SOC-003
    source_id: SRC-SOC-PLAYBOOK
    severity: P2
    dimension: technical_correctness
    title: "CERT-In 6-hour reporting presented as applying to 'critical' incidents"
    evidence:
      - {page: 32, note: "'Regulatory trigger (e.g., CERT-In reporting within 6h for critical)'."}
    verification: PRIMARY_SOURCE
    reference: [R-003]
    detail: "The Directions require reporting of the incident types in Annexure I within 6 hours of noticing, irrespective of a 'critical' label."
    recommendation: "Quote the Directions precisely, link the primary text, and add a 'check current law with counsel' note."
    remediation: {status: NOT_STARTED, where: "Track SOC-4"}
  - id: F-SOC-004
    source_id: SRC-SOC-PLAYBOOK
    severity: P1
    dimension: technical_correctness
    title: "Example brute-force correlation rule cannot detect password spraying"
    evidence:
      - {page: 22, note: "Rule groups by Source IP + Target User + Target Host with COUNT(*) > 5 in 300 s."}
      - {page: 17, note: "Decision tree example 2 assumes >10 failures from a single IP to a privileged account."}
    verification: MANUAL_READ
    detail: >-
      Grouping by target user means an attacker trying 1-2 passwords against many accounts from one IP never exceeds
      the per-user threshold. The correct signal is distinct target accounts per source within a window. Reproduced
      with a deterministic dataset in the pilot (naive rule misses the spray scenarios, improved rule detects them).
    recommendation: "Teach threshold, distinct-count and per-account logic as separate detections and validate each against labelled data."
    remediation: {status: DONE_IN_PILOT, where: "courses/soc-analyst/labs/m04-guided + tests/pilot/test_detection_gap.py (executed: naive rule detects 1 of 5 attack scenarios)"}
  - id: F-SOC-005
    source_id: SRC-SOC-PLAYBOOK
    severity: P1
    dimension: professional_outcomes
    title: "Uncited statistics, salary bands and workforce numbers presented as 2026 benchmarks"
    evidence:
      - {page: 3, note: "'AI handles ~70-90% of Tier 1 routine triage'."}
      - {page: 11, note: "'Handle 80-150 alerts (down from 500+ pre-AI)', '95%+ closure accuracy'."}
      - {page: 25, note: "FP-rate figures attributed to vendor reports without citations."}
      - {page: 28, note: "Technique impact table with FP-reduction percentage ranges."}
      - {page: 36, note: "'3-4M unfilled cyber roles (NASSCOM/ISC2 2026 estimates), India ~280K-500K gap'."}
      - {page: 37, note: "US and India salary bands attributed to job-site aggregators."}
      - {page: 39, note: "'80% of hires want proof'."}
    verification: PRIMARY_SOURCE
    reference: [R-012]
    detail: >-
      About 80 percentage/salary figures were counted (STATIC_SCAN). None carries a retrievable citation. ISC2's 2024
      study (4,763,963 gap) excludes India and China from its workforce estimate, so an ISC2-derived India gap cannot
      exist; the cited 2026 ISC2/NASSCOM estimates were not found.
    recommendation: "Remove or replace with dated, linked sources; label estimates as estimates; never use salary bands in marketing."
    remediation: {status: NOT_STARTED, where: "Track SOC-1 editorial pass"}
  - id: F-SOC-006
    source_id: SRC-SOC-PLAYBOOK
    severity: P2
    dimension: commercial_readiness
    title: "Content adapted from named vendors/blogs without attribution or licence review"
    evidence:
      - {page: 14, note: "'Adapted from Dropzone AI, Radiant Security, Prophet best practices'."}
      - {page: 20, note: "'adapted from Fortinet best practices, Stellar Cyber, DNIF'."}
      - {page: 23, note: "'Inspired by: FortiSIEM PH_RULE_ANOMALY_LATERAL_MOVEMENT patterns'."}
    verification: MANUAL_READ
    detail: "No reference list exists; the extent of derivation from vendor material is unknown. FortiSIEM rule names and UI paths were not checked against current product documentation (NEEDS_VERIFICATION)."
    recommendation: "Rewrite from primary standards and independently authored labs; add references; verify product-specific claims or drop them."
    remediation: {status: DONE_IN_PILOT, where: "courses/soc-analyst/curriculum/source-map.yaml (independently authored; vendor-neutral Sigma and synthetic data)"}
  - id: F-SOC-007
    source_id: SRC-SOC-PLAYBOOK
    severity: P2
    dimension: technical_correctness
    title: "Tuning advice trades detection coverage for noise without measuring the trade-off"
    evidence:
      - {page: 26, note: "Exclude 02:00-04:00 patching windows; raise thresholds from >5 to >10 in 5 min; whitelist IP/user/process/hash lists."}
      - {page: 29, note: "Pitfalls list says 'test changes!' but no method or dataset is provided."}
    verification: MANUAL_READ
    detail: "Time-window exclusions and higher thresholds are exactly where low-and-slow attacks hide. No before/after recall measurement is taught."
    recommendation: "Teach tuning as a measured change: every exclusion needs an owner, an expiry and a regression test against attack scenarios."
    remediation: {status: DONE_IN_PILOT, where: "courses/soc-analyst/labs/m04-independent/README.md (tuning measured against recall)"}
  - id: F-SOC-008
    source_id: SRC-SOC-PLAYBOOK
    severity: P3
    dimension: instructional_clarity
    title: "Internal contradictions in escalation and metric guidance"
    evidence:
      - {page: 13, note: "Escalation rate 5-15% is healthy; 'too high = poor tuning'. MTTA '<5-10 min' and 'target <15 min overall'."}
      - {page: 19, note: "'If unsure: Escalate anyway'."}
      - {page: 30, note: "'better over-escalate than under'."}
    verification: MANUAL_READ
    recommendation: "Define escalation criteria by evidence thresholds and severity; state one metric definition per KPI."
    remediation: {status: NOT_STARTED, where: "Track SOC-2"}
