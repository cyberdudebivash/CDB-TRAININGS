# Course quality scores -- internal quality-management instrument, NOT a market ranking and NOT a release approval.
#
# Scale per dimension is 0..max. Anchors used for every course:
#   0-20%   absent, dangerous or unusable      21-40%  material present but major defects
#   41-60%  partly usable, several significant defects     61-80%  mostly sound, fixable gaps
#   81-100% verified sound with evidence of validation (executed labs, tested code, primary-source checks)
# Scores are applied to the SOURCE PDFs as received (baseline commit f2ba7d0). They are re-scored when
# replacement content is built. Length, polish and visual style earn no points.
# confidence: HIGH   = the whole source was read in context
#             MEDIUM = 100% machine-scanned plus targeted reads of high-risk regions
#             LOW    = machine-scanned plus a small sample; the score may move materially after fuller review
dimensions:
  technical_correctness:
    max: 20
    label: Technical correctness and security
  practical_effectiveness:
    max: 20
    label: Hands-on practical effectiveness
  professional_outcomes:
    max: 15
    label: Demonstrable professional outcomes
  assessment_validity:
    max: 15
    label: Assessment validity and rigor
  instructional_clarity:
    max: 10
    label: Instructional clarity and sequencing
  technical_currency:
    max: 10
    label: Technical currency and relevance
  accessibility_experience:
    max: 5
    label: Accessibility and learner experience
  commercial_readiness:
    max: 5
    label: Commercial product readiness
courses:
  COURSE-SOC:
    title: SOC Analyst Survival Playbook (2026 Edition)
    source_ids:
    - SRC-SOC-PLAYBOOK
    confidence: HIGH
    review_coverage: 43/43 pages read in full (text layer); 12 primary-source claims verified.
    scores:
      technical_correctness:
        score: 9
        justification: Practitioner advice is largely sensible, but the NIST attribution (p. 6/30), CSF code (p. 30), CERT-In scope (p. 32) and the spray-blind correlation
          rule (p. 22) are wrong or misleading.
        findings:
        - F-SOC-001
        - F-SOC-002
        - F-SOC-003
        - F-SOC-004
      practical_effectiveness:
        score: 5
        justification: Checklists, decision trees and a runbook template are usable on the job, but there is no dataset, runnable detection or graded exercise.
        findings:
        - F-SOC-009
        - F-SOC-010
      professional_outcomes:
        score: 4
        justification: No measurable outcomes; career section relies on uncited salary and workforce numbers.
        findings:
        - F-SOC-005
        - F-SOC-011
      assessment_validity:
        score: 0
        justification: No assessment of any kind.
        findings:
        - F-SOC-009
      instructional_clarity:
        score: 7
        justification: Short, well-sectioned and readable; contradictions in escalation guidance are minor.
        findings:
        - F-SOC-008
      technical_currency:
        score: 6
        justification: Recognises SP 800-61r3 and AI-assisted triage, but ATT&CK/CSF versions are not pinned and a CSF 1.1 code is cited.
        findings:
        - F-SOC-002
        - F-SOC-011
      accessibility_experience:
        score: 4
        justification: Tagged text PDF with real outline; code is not monospaced; minor byline inconsistency.
        findings:
        - F-SOC-012
      commercial_readiness:
        score: 2
        justification: Vendor-derived content without attribution and statistics that cannot be defended in marketing.
        findings:
        - F-SOC-006
        - F-SOC-005
    strengths:
    - 'Concise, practitioner-oriented structure: handover, triage, tuning, IR and career sections each fit on a few pages (median section 146 words, the deepest of
      all sources).'
    - Section 5.1 correctly describes SP 800-61r3 as superseding r2 and organised around CSF 2.0 functions (p. 30); the defect is the contradicting summary on p.
      6.
    - 'Good practical artefacts: a 5/6-step triage loop, escalation trigger lists and an incident runbook template (pp. 14-16, 18, 34-35) that can seed graded exercises.'
    - 'Explicit pitfalls on over-tuning and stale whitelists (p. 29): the right instinct, lacking only a measurement method.'
