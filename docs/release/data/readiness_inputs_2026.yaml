# Inputs to docs/release/OCT2026_PRODUCTION_READINESS.md that cannot be computed from the catalog or the evidence files.
# Every status here is a statement about the REAL STATE OF THE WORLD (who has reviewed what, which decisions the owner has made).
# Only a person can change it, and a change needs evidence outside this repository's automation. Nothing here is aspirational.
#
# status values: NOT_MET (default), PARTIAL, MET. `blockers` name owner decisions (docs/audits/IP_AND_LICENSE_REVIEW.md section 4) or findings.
schema_version: 1
as_of: 2026-10-14
defaults:
  editorial: {status: NOT_MET, note: "No editorial or SME review has taken place; automated checks only."}
  ip_licensing: {status: NOT_MET, blockers: [D4], note: "Copyright holder and licence are undecided (D4); similarity scan and authorship statement not done (IP-9 / A5)."}
  commercial: {status: NOT_MET, note: "Pricing and positioning exist only as hypotheses (docs/commercial/PRICING_AND_POSITIONING_RESEARCH.md); no demand evidence, no listing, no price set."}
  academy_integration: {status: NOT_MET, note: "No Academy platform integration exists or is planned in this repository; content is delivered as Markdown and a student-edition PDF build."}
  human_approval: {status: NOT_MET, note: "No named owner, reviewer or approval is recorded."}
course_overrides:
  COURSE-OSINT:
    ip_licensing: {status: NOT_MET, blockers: [D3, D4, IP-1], note: "The source plans to redistribute GPL-licensed tools under a proprietary licence (F-OSINT-002); counsel review (A3) is required before any OSINT product."}
  COURSE-FE-ONBOARD:
    ip_licensing: {status: NOT_MET, blockers: [D1, D2, D4], note: "The source contains a named individual's personal data on public pages (F-FE-001) and may describe another organisation's internal practice (F-FE-002)."}
  COURSE-SOC:
    ip_licensing: {status: NOT_MET, blockers: [D4, IP-4], note: "Source text was adapted from vendor material without references (F-SOC-006); the pilot module is rewritten from primary standards. MITRE attribution notices travel with ATT&CK content."}
  COURSE-CYBER-MEGA:
    ip_licensing: {status: NOT_MET, blockers: [D4, IP-5, IP-6], note: "Leaked-password corpus reference and endorsement statements in the source (F-MEGA-002, F-MEGA-009)."}
