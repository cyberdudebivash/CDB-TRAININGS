# Findings made by running the lab matrix, kept so the evidence report can state them. Newest last.
notes:
  - date: 2026-10-14
    interpreter: "3.12.3 (distribution package)"
    finding: "A first matrix run failed one check on this interpreter only: test_exploit_tls_context_verifies_certificates_and_names asserted ssl.SSLContext.minimum_version >= TLS 1.2, which the distribution's OpenSSL configuration reports differently than the other builds."
    action: "The assertion about the minimum protocol version was removed from the check and from the lab README contract (it depended on platform configuration, not on the learner's code); certificate and host-name verification are still checked. The matrix was re-run on the committed tree."
  - date: 2026-10-16
    interpreter: "3.13.16 (distribution package)"
    finding: "In a long run that the environment interrupted several times, the piece labs-m10 failed once on this interpreter: the hidden suite of the PY-M10 independent lab reported one required seeded defect (I140) as surviving, although the same defect was killed in 12 of 12 isolated runs afterwards and the standalone mutation run killed 274 of 274 required defects. The container had restarted at the end of that piece; a mutant whose test process is cut short by a signal is not reported as a failure by pytest, so it looks alive."
    action: "The cause was probable, not proven. The three mutation tests of PY-M10 and PY-M11 that read a survivor now run each required survivor again, alone, and count it as alive only if it survives twice (settle_survivors in tests/test_python_engineering_labs.py, with its own unit tests); the mutation tools and the modules were not changed. The piece was re-run and passed on 3.13, 3.14 and 3.15."
  - date: 2026-10-16
    interpreter: "3.11.17 and 3.12.3"
    finding: "The recorded run was assembled from interrupted attempts on identical module content (the same tree identity): on CPython 3.11 and 3.12, the pieces labs-m01-m04 to labs-m10 were passed in an earlier attempt of this run and reused; module-packs and labs-m11 were run again on both interpreters, and every piece ran in full on 3.13, 3.14 and 3.15. All five interpreters executed the same 248 tests."
    action: "No action needed. The earlier attempt was started with SIGINT ignored (next note); a piece that depends on Ctrl-C fails in that state, never passes, so a reused pass is not affected, and the two pieces that contain Ctrl-C checks were run again in a correctly started process."
  - date: 2026-10-16
    interpreter: "3.11.17 (first attempt on the merged tree, discarded)"
    finding: "A matrix run that was started in the background of a non-interactive shell ( ( cmd & ) ) inherited an ignored SIGINT for every process below it. Python then installs no KeyboardInterrupt handler, so the five Ctrl-C checks of PY-M11 (the interrupt test of the hidden suite, the two mutation baselines that include it, and the lesson block that sends SIGINT) failed on CPython 3.11 although the content had not changed; earlier runs passed them because they were launched with job control."
    action: "The failed attempt was discarded, not recorded. The runner now restores the default SIGINT itself when it finds it ignored (restore_default_sigint, with a test), so the evidence no longer depends on how the run was started; the run was repeated from the start."
  - date: 2026-10-16
    interpreter: "all five"
    finding: "Modules of the Digital Foundations course kept arriving on the default branch while the five-hour matrix was running (FND-M03 and FND-M04, then FND-M05), and every arrival changed the identity of the whole tree, so a recorded run was out of date for the new module within hours and had to be repeated in full."
    action: "run_lab_matrix.py --reuse-record reuses, from the last recorded run, each piece whose scope is identical: the same test files, the same content of the modules the piece runs (lesson, labs, shared lab tools, pinned toolchain, private pack) and the same interpreter build. The pieces that read the whole tree (module packs, foundations, the unclassified labs tests) always run again. Every reused piece is marked carried_from in the record and listed in the evidence report. The last matrix of this branch ran in this way: the seven lab pieces of the Python Engineering modules come from the run at 9d784f3ca2d6; the other three ran on all five interpreters."
