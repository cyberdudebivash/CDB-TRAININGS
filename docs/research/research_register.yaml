  - id: R-009
    title: "OWASP Top 10 for LLM Applications 2025"
    url: https://genai.owasp.org/llm-top-10/
    publisher: OWASP GenAI Security Project
    version: "2025"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      LLM01 Prompt Injection; LLM02 Sensitive Information Disclosure; LLM03 Supply Chain; LLM04 Data and Model
      Poisoning; LLM05 Improper Output Handling; LLM06 Excessive Agency; LLM07 System Prompt Leakage;
