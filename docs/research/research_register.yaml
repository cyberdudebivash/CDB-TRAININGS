    applies_to: [COURSE-SOC]
    resulting_change: "Pilot lesson maps scenarios to T1110.001/.003 and cites the ATT&CK version; attribution notice added."
  - id: R-023
    title: "Sigma Rules and Correlation Rules Specifications"
    url: https://github.com/SigmaHQ/sigma-specification
    publisher: SigmaHQ
    version: "specification 2.1.0, released 2025-08-02"
    verified_on: 2026-10-14
    method: PRIMARY_DOCUMENT_READ
    finding: >
      Correlation rules are separate YAML documents with correlation.type (event_count, value_count, temporal,
      temporal_ordered), rules (by id or name), group-by, timespan (Xs/Xm/Xh/Xd) and a single-criterion condition
      (gt, gte, lt, lte, eq, neq; value_count adds `field`). Value modifiers include contains, startswith, endswith, all,
      exists, re, cidr and numeric lt/lte/gt/gte. Condition grammar: and/or/not, brackets, `1 of`/`all of` with
      patterns and `them`. pySigma 2.0.1 parses both rule kinds (executed).
    applies_to: [COURSE-SOC]
    resulting_change: "Pilot rules and the teaching evaluator (shared sigma_lite) follow this subset; unsupported features fail closed."
