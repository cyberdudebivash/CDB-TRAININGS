  - id: R-010
    title: "MITRE ATT&CK - version history / updates"
    url: https://attack.mitre.org/resources/updates/
    publisher: MITRE
    version: "ATT&CK v20, 2026-10-13 (Enterprise: 227 techniques, 479 sub-techniques)"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: "v20 is the current release as of the verification date. Courses should name the ATT&CK version they map to."
    applies_to: [COURSE-SOC, COURSE-CYBER-MEGA]
    resulting_change: "Course content must pin the ATT&CK version (see pilot unit)."
  - id: R-011
    title: "Web Content Accessibility Guidelines (WCAG) 2.2"
    url: https://www.w3.org/TR/WCAG22/
    publisher: W3C
    version: "W3C Recommendation (page dated 12 December 2024)"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      WCAG 2.2 adds nine success criteria over 2.1 (2.4.11, 2.4.12, 2.4.13, 2.5.7, 2.5.8, 3.2.6, 3.3.7, 3.3.8, 3.3.9)
      and removes 4.1.1 Parsing.
    applies_to: [COURSE-FE-ONBOARD, ALL]
    resulting_change: "Design system targets WCAG 2.2 AA (docs/architecture/DESIGN_SYSTEM.md)."
  - id: R-012
    title: "ISC2 2024 Cybersecurity Workforce Study"
    url: https://www.isc2.org/Insights/2024/10/ISC2-2024-Cybersecurity-Workforce-Study
    publisher: ISC2
    version: "2024 (published Oct 2024)"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      Global workforce gap estimated at 4,763,963 (+19.1% vs 2023). Survey of 15,852 professionals run with Forrester
      in Apr-May 2024; the workforce estimate excludes China and India.
    applies_to: [COURSE-SOC, COURSE-OSINT]
    resulting_change: "Findings F-SOC-005, F-OSINT-005: an 'India gap from ISC2' cannot come from this study; '3.5M' figures are not ISC2's 2024 number."
  - id: R-013
    title: "Licences of tools proposed for redistribution in the OSINT bundle"
    url: https://github.com/laramies/theHarvester
    publisher: GitHub repositories (theHarvester, recon-ng, Sherlock)
    version: "repository pages as of 2026-10-14"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      theHarvester: GPL-2.0 only. recon-ng (lanmaster53): GPL-3.0. Sherlock: MIT. The licences of Maltego CE and
      SpiderFoot HX were NOT checked (NEEDS_VERIFICATION). The GitHub REST licence API returned HTTP 403 through the
      session proxy, so repository pages were read instead.
    applies_to: [COURSE-OSINT]
    resulting_change: "Finding F-OSINT-002; docs/audits/IP_AND_LICENSE_REVIEW.md."
  - id: R-014
    title: "google-github-actions/auth README - authentication options"
    url: https://github.com/google-github-actions/auth
    publisher: Google (open-source GitHub Action)
    version: "README as of 2026-10-14"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      "Workload Identity Federation is recommended over Service Account Keys"; service-account key JSON must be
      treated like a password and never expires by default.
    applies_to: [COURSE-GCP-DE]
    resulting_change: "Finding F-GCP-001."
  - id: R-015
    title: "Google Cloud IAM - Best practices for managing service account keys"
    url: https://docs.cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
    publisher: Google Cloud
    version: "as published 2026-10-14"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      Service account keys "can become a security risk if not managed carefully"; treat key use as an exception;
      use organization-policy constraints to block key creation. For organizations created on or after 2024-05-03
      these constraints are enforced by default.
    applies_to: [COURSE-GCP-DE]
    resulting_change: "Finding F-GCP-001 (key-based CI examples fail by default in newer organizations)."
  - id: R-016
    title: "Google Cloud - Professional Data Engineer certification"
    url: https://cloud.google.com/learn/certification/data-engineer
    publisher: Google Cloud
    version: "as published 2026-10-14"
    verified_on: 2026-10-14
    method: OFFICIAL_PAGE_SUMMARY
    finding: >
      Exam assesses five areas: design data processing systems; ingest and process the data; store the data;
      prepare and use data for analysis; maintain and automate data workloads. 2 hours, 40-50 questions, USD 200,
      valid 2 years, recommended 3+ years industry / 1+ year on Google Cloud. The exam-guide PDF itself was not read.
    applies_to: [COURSE-GCP-DE]
    resulting_change: "Finding F-GCP-004; certification alignment must be re-verified against the exam guide before it is claimed."
