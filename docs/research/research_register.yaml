    method: OFFICIAL_PAGE_SUMMARY
    finding: 'Headline changes: PEP 810 explicit lazy imports (lazy keyword), PEP 814 frozendict, PEP 661 sentinel, PEP 798
      unpacking in comprehensions, PEP 686 UTF-8 as default encoding (I/O without explicit encoding now UTF-8), new profiling
      package (PEP 799; profile module deprecated, removal in 3.17), PEP 829 .start files and silent deprecation of import
      lines in .pth files, PEP 803 abi3t stable ABI for free-threaded builds, upgraded experimental JIT, re.prefixmatch()
      with re.match soft-deprecated. Summary covered the first ~100k of 213k characters; the removals list was not fully read.'
    applies_to:
    - COURSE-PY-ENG
    - COURSE-PY-AUTO
    - COURSE-AI-ENG
    resulting_change: 'Python baseline policy: teach and test on 3.13/3.14 for broad compatibility, note 3.15 features as
      ''new, verify library support''; always pass encoding= explicitly; do not rely on import lines in .pth files.'
    verified_on: '2026-10-14'
