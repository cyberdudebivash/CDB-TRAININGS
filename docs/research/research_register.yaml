  - id: R-027
    title: MCP specification 2026-07-28 - Key Changes
    url: https://modelcontextprotocol.io/specification/2026-07-28/changelog
    publisher: Model Context Protocol project
    version: '2026-07-28'
    method: PRIMARY_DOCUMENT_READ
    finding: 'Protocol-level sessions and the Mcp-Session-Id header removed; the initialize handshake removed (stateless:
      version and client capabilities in _meta on every request); server/discover added; subscriptions/listen replaces GET
      endpoint and resources/subscribe; ping, logging/setLevel and roots list_changed removed; tasks moved to an official
      extension; Multi Round-Trip Requests (input_required results) replace server-initiated requests; required resultType
      on all results; SSE resumability removed; cacheable list results (ttlMs, cacheScope); OTel trace context conventions
      in _meta; Roots, Sampling and Logging deprecated; HTTP+SSE transport deprecated; OAuth Dynamic Client Registration deprecated
      in favour of Client ID Metadata Documents; RFC 9207 iss validation.'
    applies_to:
    - COURSE-AI-ENG
    - COURSE-CYBER-MEGA
    resulting_change: MCP lesson rewritten around stateless requests, MRTR, and the security implications of tool schemas
      and OAuth; legacy handshake content marked as 2025-11-25 and earlier.
    verified_on: '2026-10-14'
