# Research register -- every externally sourced statement that an audit finding or course change relies on.
#
# verified_on:  2026-10-14 (all entries below were checked on this date).
# method values:
#   PRIMARY_DOCUMENT_READ   the primary document/PDF was downloaded and the cited passage was read directly
#   EXECUTED                the claim was reproduced by running code in a clean environment
#   REGISTRY_API            machine-readable package-registry / lifecycle data retrieved by scripts/research/fetch_registry_versions.py
#   SECONDARY_SOURCE        trade press or other non-primary coverage; must carry a caveat and is never sufficient for customer-facing claims
#   OFFICIAL_PAGE_SUMMARY   an official web page was fetched through a summarising tool; the summary was
#                           NOT cross-checked against the raw page text. Re-verify against the primary text
#                           before the statement is used in any customer-facing material.
# Entries never contain extracted text from the audited training PDFs.
register:
  - id: R-001
    title: "NIST SP 800-61 Rev. 3 - Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile"
    url: https://csrc.nist.gov/pubs/sp/800/61/r3/final
    primary_url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r3.pdf
    publisher: NIST
    version: "April 2025 (final); supersedes SP 800-61 Rev. 2 (Aug 2012)"
    verified_on: 2026-10-14
    method: PRIMARY_DOCUMENT_READ
    finding: >
      Section 2.1 contrasts the previous (Rev. 2) life-cycle model with a model based on the six CSF 2.0 Functions
      (Govern, Identify, Protect, Detect, Respond, Recover). Table 1 maps the four Rev. 2 phases (Preparation;
      Detection & Analysis; Containment, Eradication & Recovery; Post-Incident Activity) to CSF 2.0 Functions.
      Rev. 3 does not define a six-phase lifecycle; Rev. 2 had four phases.
    applies_to: [COURSE-SOC]
    resulting_change: "Findings F-SOC-001; pilot unit text uses the NIST-accurate description and labels PICERL as a common practitioner model, not NIST."
  - id: R-002
    title: "NIST CSWP 29 - The NIST Cybersecurity Framework (CSF) 2.0"
    url: https://csrc.nist.gov/pubs/cswp/29/the-nist-cybersecurity-framework-csf-20/final
    primary_url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf
    publisher: NIST
    version: "CSF 2.0 (Feb 2024)"
    verified_on: 2026-10-14
    method: PRIMARY_DOCUMENT_READ
    finding: >
      The Respond (RS) function lists categories RS.MA (Incident Management), RS.AN (Incident Analysis),
      RS.CO (Incident Response Reporting and Communication) and RS.MI (Incident Mitigation). The identifier
      "RS.RP" does not occur anywhere in the CSF 2.0 document (0 matches).
    applies_to: [COURSE-SOC]
    resulting_change: "Finding F-SOC-002."
  - id: R-003
    title: "CERT-In Directions No. 20(3)/2022-CERT-In under section 70B(6) of the IT Act 2000"
    url: https://www.cert-in.org.in/PDF/CERT-In_Directions_70B_28.04.2022.pdf
    publisher: Indian Computer Emergency Response Team (MeitY)
    version: "28 April 2022"
    verified_on: 2026-10-14
    method: PRIMARY_DOCUMENT_READ
    finding: >
      Direction (ii): service providers, intermediaries, data centres, body corporates and Government organisations
      must report cyber incidents listed in Annexure I to CERT-In within 6 hours of noticing them or being
      brought to notice about them. The obligation is tied to Annexure I incident types, not to "critical" severity.
    applies_to: [COURSE-SOC]
    resulting_change: "Finding F-SOC-003."
