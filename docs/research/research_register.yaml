  - id: R-088
    title: HTTPX - Timeouts and Requests-compatibility pages
    url: https://www.python-httpx.org/advanced/timeouts/
    publisher: HTTPX project
    version: pages read 2026-10-14 (PyPI snapshot version 0.28.1, released 2024-12-06; a 1.0.dev6 pre-release exists)
    method: OFFICIAL_PAGE_SUMMARY
    finding: 'Default behaviour is to raise a TimeoutException after 5 seconds of network inactivity; there are four timeout
      kinds (connect, read, write, pool) raising ConnectTimeout, ReadTimeout, WriteTimeout and PoolTimeout; timeout=None disables
      them. The compatibility page states "HTTPX defaults to including reasonable timeouts for all network operations, while
      Requests has no timeouts by default" and that HTTPX "does not follow redirects by default" (follow_redirects=True enables
      it).'
    applies_to:
    - COURSE-PY-ENG
    - COURSE-PY-AUTO
    resulting_change: PY-M05 contrasts the two clients' defaults and teaches an explicit Timeout object; the handbook's per-call
      AsyncClient pattern is replaced by one shared client.
    caveat: Fetched through a summarising tool (two pages). The newest stable release is almost two years old on the cutoff
      date, with a 1.0 pre-release published 2026-08-31 (registry snapshot); the lesson pins 0.28.1 and does not claim 1.0 behaviour.
    verified_on: '2026-10-14'
  - id: R-089
    title: RFC 9110 - HTTP Semantics (idempotent methods; Retry-After)
    url: https://www.rfc-editor.org/rfc/rfc9110.html
    publisher: IETF (STD 97, June 2022)
    version: text read 2026-10-14 in two slices (offsets 0-100000 and 200000-300000)
    method: OFFICIAL_PAGE_SUMMARY
    finding: 'Section 9.2.2: PUT, DELETE and the safe methods are idempotent; "A client SHOULD NOT automatically retry a request
      with a non-idempotent method" unless it can know the request is effectively idempotent or was not applied. Section 10.2.3:
      Retry-After is either an HTTP-date or a number of seconds, used with 503 responses and 3xx redirections.'
    applies_to:
    - COURSE-PY-ENG
    - COURSE-PY-AUTO
    resulting_change: PY-M05 retries only idempotent requests and honours Retry-After in both formats; POST retries need an idempotency
      mechanism the lesson names but does not assume.
    caveat: Fetched through a summarising tool; only the slices named above were read. Retry-After on 429 responses comes from
      RFC 6585, which was not read here, so the lab treats it as an observed convention, not a cited rule.
    verified_on: '2026-10-14'
  - id: R-090
    title: Pydantic - Strict Mode (lax coercion by default)
    url: https://pydantic.dev/docs/validation/latest/concepts/strict_mode/
    publisher: Pydantic
    version: page read 2026-10-14 (PyPI snapshot version 2.14.1; the older docs.pydantic.dev URL redirects here)
    method: OFFICIAL_PAGE_SUMMARY
    finding: 'By default Pydantic attempts to coerce values to the desired type (the string "123" becomes the int 123); strict
      mode errors instead. Strict mode can be enabled per validation call (strict=True), per field (Field(strict=True), Strict
      metadata, StrictInt) or per model (ConfigDict(strict=True)).'
    applies_to:
