  - id: R-093
    title: Python documentation - Coroutines and Tasks (gather, TaskGroup, timeout, create_task, cancellation)
    url: https://docs.python.org/3/library/asyncio-task.html
    publisher: Python Software Foundation
    version: page read 2026-10-14 (documentation for the current stable release)
    method: OFFICIAL_PAGE_SUMMARY
    finding: 'gather with the default return_exceptions=False propagates the first exception and the other awaitables "won''t be
      cancelled and will continue to run". TaskGroup (added in 3.11) cancels the remaining tasks when one fails with an exception
      other than CancelledError and raises the collected exceptions as an ExceptionGroup; it "provides stronger safety guarantees
      than gather". asyncio.timeout (added in 3.11) cancels the current task and turns the CancelledError into a TimeoutError that
      can only be caught outside the context manager. create_task: "The event loop only keeps weak references to tasks. A task that
      isn''t referenced elsewhere may get garbage collected at any time, even before it''s done"; a TaskGroup keeps a strong reference.
      A caught CancelledError "should generally be propagated when clean-up is complete".'
    applies_to:
    - COURSE-PY-ENG
    - COURSE-PY-AUTO
    resulting_change: PY-M06 teaches TaskGroup and asyncio.timeout as the default, shows gather's behaviour by execution, and treats
      swallowed cancellation as a defect.
    caveat: Fetched through a summarising tool; quoted sentences were returned by the tool, not cross-checked against the raw page.
    verified_on: '2026-10-14'
