  - id: R-095
    title: asyncio and concurrency features by CPython version (reproduced on 3.11.17, 3.12.3, 3.13.16, 3.14.8 and 3.15.0)
    url: https://docs.python.org/3/library/asyncio.html
    publisher: Python Software Foundation
    version: CPython 3.11.17, 3.12.3, 3.13.16, 3.14.8, 3.15.0 (standard builds, GIL enabled)
    method: EXECUTED
    finding: 'asyncio.TaskGroup, asyncio.timeout and asyncio.Runner exist on all five versions; asyncio.eager_task_factory from 3.12;
      asyncio.Queue.shutdown and QueueShutDown from 3.13; sys._is_gil_enabled() from 3.13; concurrent.futures.InterpreterPoolExecutor
      and the concurrent.interpreters module from 3.14. asyncio.get_event_loop() with no running loop returns a loop on 3.11 to 3.13
      (with a DeprecationWarning from 3.12) and raises RuntimeError from 3.14; asyncio.iscoroutinefunction and
      asyncio.get_event_loop_policy emit DeprecationWarning on 3.14 and 3.15. All standard builds in the matrix had the GIL enabled.
      The PY-M06 lesson asserts this table and is executed on every interpreter.'
    applies_to:
    - COURSE-PY-ENG
    resulting_change: PY-M06 uses asyncio.run, TaskGroup and asyncio.timeout (3.11+) and records which newer features it avoids so that labs run on all supported versions.
    verified_on: '2026-10-14'
  - id: R-096
    title: Object model, dataclass and typing behaviours by CPython version (reproduced on 3.11.17, 3.12.3, 3.13.16, 3.14.8 and 3.15.0)
    url: https://docs.python.org/3/reference/datamodel.html
    publisher: Python Software Foundation
    version: CPython 3.11.17, 3.12.3, 3.13.16, 3.14.8, 3.15.0 (standard builds)
    method: EXECUTED
    finding: 'A mutable class attribute is shared by every instance and `self.count += 1` creates an instance attribute (all versions). Name mangling
      of `self.__secret` in class User produces `_User__secret` (all versions). A dataclass with a list default raises ValueError ("use default_factory");
      a non-frozen dataclass with eq=True has __hash__ None; a frozen one is hashable; mutating an object after it went into a set loses it. typing.override
      exists from 3.12; copy.replace from 3.13; zero-argument super() works inside a @dataclass(slots=True) subclass from 3.13 (TypeError on 3.11 and 3.12);
      a dataclass annotation that names a class defined later works without quotes from 3.14 (NameError on 3.11 to 3.13) and the annotationlib module exists
      from 3.14. isinstance() against a runtime_checkable Protocol checks method names only, not signatures. A WeakSet drops a bound method at once while
      weakref.WeakMethod follows the object. The PY-M12 lesson asserts every one of these and is executed on every interpreter of the matrix.'
    applies_to:
    - COURSE-PY-ENG
    resulting_change: PY-M12 teaches the corrected behaviour, gates the version-dependent features behind explicit version checks and avoids all four newer features in its labs so that they run on 3.11 to 3.15.
    verified_on: '2026-10-15'
