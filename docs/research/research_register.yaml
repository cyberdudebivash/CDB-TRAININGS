  - id: R-021
    title: "Microsoft Learn - 4625(F) An account failed to log on (Windows 10 security auditing reference)"
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
    publisher: Microsoft
    version: "page ms.date 2026-03-29 (archived Windows 10 reference)"
    verified_on: 2026-10-14
    method: PRIMARY_DOCUMENT_READ
    finding: >
      Defines the 4625 fields (Logon Type, Account For Which Logon Failed, Failure Information Status/Sub Status, Network
      Information workstation and source address) and the logon-type table (2 Interactive, 3 Network, 4 Batch, 5 Service,
      7 Unlock, 8 NetworkCleartext, 9 NewCredentials, 10 RemoteInteractive, 11 CachedInteractive). Documented Status values
      include 0xC0000064 (bad user name; several in a row can indicate user enumeration), 0xC000006A (bad password),
      0xC000006D (bad user name or authentication information), 0xC0000072 (account disabled), 0xC0000193 (expired account),
      0xC0000234 (account locked out). The page is an archived Windows 10 reference.
    applies_to: [COURSE-SOC]
    resulting_change: "Pilot lesson field and status tables; only documented status codes are used."
