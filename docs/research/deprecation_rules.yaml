# Currency and obsolescence rules applied to every source page by scripts/audit/build_page_records.py.
#
# Each rule links a pattern found in the legacy sources to the evidence that makes it a currency problem:
#   * evidence entries starting with R-  -> docs/research/research_register.yaml
#   * evidence entries starting with probe: -> docs/research/data/api_probes_2026-10-14.json (code actually executed)
#   * evidence entries starting with snapshot: -> docs/research/data/registry_snapshot_2026-10-14.json
# A rule never claims more than its evidence shows. A pattern match on a page is a CANDIDATE; the page record keeps
# confidence MACHINE until a person confirms the context (a page may mention a retired API in order to warn against it).
#
# tech:    registry ids (docs/research/technology_registry.yaml) the rule concerns; used to build docs/research/TECHNOLOGY_BASELINES_2026.md
# issue types:  OBSOLETE_API  RETIRED_MODEL  END_OF_LIFE_VERSION  SUPERSEDED_PRODUCT  SUPERSEDED_STANDARD  OLD_BASELINE
#               SECURITY_ANTIPATTERN  TEST_ANTIPATTERN  INCORRECT_CLAIM  STANDARD_VERSION_UNVERIFIED  LEGAL_ETHICS_REVIEW
#   evidence entries starting with F- cite a finding in docs/audits/data/findings.yaml; TEST_ANTIPATTERN rules need no external evidence.
# severity: P1 (breaks or misleads on a current system) .. P4 (informational)
# action:   the modernization action this evidence implies (REPLACE, UPDATE, DEPRECATE, REMOVE, EXPAND, ADD, MERGE, KEEP)
schema_version: 1
as_of: 2026-10-14
rules:
  # ------------------------------------------------------------------ Python
  - {id: DR-PY-001, tech: [selenium, find_element_by], rx: 'find_elements?_by_\w+', issue: OBSOLETE_API, severity: P2, action: REPLACE, label: "Selenium legacy find_element_by_* locators",
     current: "Removed: WebDriver has no find_element_by_id / find_elements_by_xpath on Selenium 4.51.0 (executed).", replacement: "driver.find_element(By.ID, ...) with explicit waits; or Playwright locators", evidence: ["probe:selenium-python-legacy-locators", "R-050"]}
  - {id: DR-PY-002, tech: [selenium], rx: 'executable_path\s*=', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "Selenium webdriver.Chrome(executable_path=...)",
     current: "webdriver.Chrome.__init__ accepts options, service, keep_alive only (executed); driver path goes through Service and Selenium Manager.", replacement: "Service(...) or rely on Selenium Manager", evidence: ["probe:selenium-python-legacy-locators"]}
  - {id: DR-PY-003, tech: [openai], rx: 'openai\.(?:ChatCompletion|Completion|Embedding)\b', issue: OBSOLETE_API, severity: P1, action: REPLACE, label: "openai module-level ChatCompletion/Completion/Embedding",
     current: "Calling them raises APIRemovedInV1 on openai 3.31.0 (executed).", replacement: "client = OpenAI(); client.chat.completions / responses API behind a provider-neutral interface", evidence: ["probe:openai-legacy-module-api", "R-037"]}
  - {id: DR-PY-004, tech: [langchain, langchain_legacy], rx: 'from langchain\.(?:llms|chat_models|embeddings|vectorstores|chains|text_splitter|agents|memory|prompts|document_loaders|retrievers)\b|\bLLMChain\b|\binitialize_agent\b|\bConversationalRetrievalChain\b|\bRetrievalQA\b|\bAgentExecutor\b', issue: OBSOLETE_API, severity: P1, action: REPLACE, label: "LangChain pre-1.0 imports and chains",
     current: "On langchain 1.4.5 these modules/attributes do not exist (executed); legacy chains moved to langchain-classic and agents use create_agent.", replacement: "langchain 1.x APIs (create_agent), langchain-text-splitters, provider packages; or minimal framework-free code", evidence: ["probe:langchain-legacy-imports", "R-004", "R-063"]}
  - {id: DR-PY-005, tech: [pytest], rx: 'pytest\.yield_fixture', issue: OBSOLETE_API, severity: P4, action: REPLACE, label: "pytest.yield_fixture", current: "Name still present on pytest 9.1.1 but superseded by @pytest.fixture with yield (executed: attribute exists).", replacement: "@pytest.fixture", evidence: ["probe:pytest-removed-apis"]}
  - {id: DR-PY-006, tech: [python], rx: '(?:^|\n)\s*(?:import|from)\s+(?:distutils|imp|asyncore|asynchat|smtpd|cgi|cgitb|telnetlib|pipes|crypt|nntplib|lib2to3)\b', issue: OBSOLETE_API, severity: P2, action: REPLACE, label: "Python standard-library modules removed by 3.13",
     current: "distutils, imp, asyncore, asynchat, smtpd, cgi, cgitb, telnetlib, pipes, crypt, nntplib, lib2to3 raise ModuleNotFoundError on CPython 3.13.16 (executed).", replacement: "setuptools/pyproject, importlib, asyncio, email/smtplib, urllib/http, subprocess, third-party equivalents", evidence: ["probe:cpython-removed-stdlib"]}
  - {id: DR-PY-007, tech: [python], rx: 'datetime\.utcnow\(\)|datetime\.utcfromtimestamp\(', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "datetime.utcnow()", current: "Emits DeprecationWarning on CPython 3.12+ (executed).", replacement: "datetime.now(timezone.utc)", evidence: ["probe:cpython-removed-stdlib", "R-018"]}
  - {id: DR-PY-008, tech: [python, asyncio], rx: 'asyncio\.get_event_loop\(\)', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "asyncio.get_event_loop()", current: "Emits DeprecationWarning on 3.13 when no loop is running (executed).", replacement: "asyncio.run() / asyncio.Runner", evidence: ["probe:cpython-removed-stdlib"]}
  - {id: DR-PY-009, tech: [pydantic], rx: '@validator\b|\.parse_obj\(|from pydantic import[^\n]*\bvalidator\b', issue: OBSOLETE_API, severity: P3, action: UPDATE, label: "pydantic v1-style API",
     current: "Still importable on pydantic 2.14.1 but emits PydanticDeprecatedSince20 (executed).", replacement: "@field_validator, model_validate, model_config", evidence: ["probe:pydantic-v1-style-api"]}
  - {id: DR-PY-010, tech: [fastapi], rx: '@app\.on_event\(', issue: OBSOLETE_API, severity: P3, action: UPDATE, label: "FastAPI on_event handlers", current: "Accepted on FastAPI 0.143.0 with DeprecationWarning; lifespan parameter is the supported mechanism (executed).", replacement: "lifespan context manager", evidence: ["probe:fastapi-on-event"]}
  - {id: DR-PY-011, tech: [sqlalchemy], rx: '\bengine\.execute\(', issue: OBSOLETE_API, severity: P2, action: REPLACE, label: "SQLAlchemy engine.execute()", current: "Engine has no execute on SQLAlchemy 2.1.4; raw strings raise ObjectNotExecutableError (executed).", replacement: "with engine.connect() as conn: conn.execute(text(...), params)", evidence: ["probe:sqlalchemy-legacy-execute"]}
  - {id: DR-PY-012, tech: [sqlalchemy], rx: 'from sqlalchemy\.ext\.declarative import declarative_base', issue: OBSOLETE_API, severity: P4, action: UPDATE, label: "sqlalchemy.ext.declarative.declarative_base", current: "Works but emits MovedIn20Warning (executed).", replacement: "from sqlalchemy.orm import DeclarativeBase / declarative_base", evidence: ["probe:sqlalchemy-legacy-execute"]}
  - {id: DR-PY-013, tech: [pandas, numpy], rx: '\.iteritems\(\)|\.applymap\(|\bnp\.(?:float_|bool8|product|cumproduct|in1d|row_stack|unicode_|string_|Inf|NaN)\b', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "pandas/numpy names removed in current majors", current: "Series.iteritems, DataFrame.applymap and np.float_/bool8/product/cumproduct/in1d/row_stack/unicode_/string_/Inf/NaN are absent on pandas 3.0.6 / numpy 2.5.4 (executed).", replacement: ".items(), .map(), np.float64, np.bool_, np.prod, np.isin, np.vstack, np.inf, np.nan", evidence: ["probe:pandas-removed-apis"]}
  - {id: DR-PY-014, tech: [pyyaml], rx: 'yaml\.load\((?![^)\n]*Loader)', issue: SECURITY_ANTIPATTERN, severity: P2, action: REPLACE, label: "yaml.load without Loader", current: "PyYAML 6.0.3 raises TypeError without Loader (executed); historic examples used the unsafe default.", replacement: "yaml.safe_load", evidence: ["probe:pyyaml-unsafe-load"]}
  - {id: DR-PY-015, tech: [pyjwt], rx: 'jwt\.decode\((?![^)\n]*algorithms)', issue: SECURITY_ANTIPATTERN, severity: P2, action: REPLACE, label: "jwt.decode without algorithms", current: "PyJWT 2.15.1 raises DecodeError unless algorithms is given (executed); omitting it was a known algorithm-confusion pattern.", replacement: "jwt.decode(token, key, algorithms=['...'])", evidence: ["probe:pyjwt-decode-algorithms"]}
  - {id: DR-PY-016, tech: [flask], rx: 'before_first_request|flask\.json\.JSONEncoder|from flask import[^\n]*\b(?:escape|Markup)\b', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "Flask removed names", current: "before_first_request, flask.json.JSONEncoder, flask.escape and flask.Markup are absent on Flask 3.1.3 (executed).", replacement: "app startup code / DefaultJSONProvider; markupsafe.escape", evidence: ["probe:flask-removed-apis"]}
  - {id: DR-PY-017, tech: [django], rx: 'from django\.conf\.urls import url|\bforce_text\b|\bugettext\b', issue: OBSOLETE_API, severity: P3, action: REPLACE, label: "Django removed names", current: "django.conf.urls.url, force_text and ugettext raise AttributeError on Django 6.1.2 (executed).", replacement: "django.urls.path/re_path, force_str, gettext", evidence: ["probe:django-removed-apis"]}
  - {id: DR-PY-018, tech: [paramiko], rx: 'AutoAddPolicy\(\)|DSSKey', issue: SECURITY_ANTIPATTERN, severity: P2, action: REPLACE, label: "paramiko AutoAddPolicy / DSSKey", current: "AutoAddPolicy still exists on paramiko 5.0.0 (accepts any host key); DSSKey is gone (executed).", replacement: "RejectPolicy/known_hosts verification; Ed25519/RSA keys", evidence: ["probe:paramiko-host-key-policy"]}
  - {id: DR-PY-019, tech: [beautifulsoup], rx: '(?-i:\.(?:findAll|findChildren|findNext)\()', issue: OBSOLETE_API, severity: P4, action: UPDATE, label: "BeautifulSoup camelCase methods", current: "findAll still works on beautifulsoup4 4.15.0 but emits DeprecationWarning (executed).", replacement: "find_all", evidence: ["probe:bs4-camelcase-methods"]}
  - {id: DR-PY-020, tech: [setup.py, pyproject], rx: 'python setup\.py\s+(?:install|sdist|bdist_wheel|bdist|test|develop|upload)\b', issue: OBSOLETE_API, severity: P2, action: REPLACE, label: "python setup.py <command>",
     current: "On setuptools 84.0.0 sdist/bdist_wheel/install still run but print deprecation warnings, and 'setup.py test' is an invalid command (executed). PyPA lists pyproject.toml as the build metadata specification.", replacement: "pyproject.toml + python -m build; pytest directly", evidence: ["probe:setuptools-setup-py-commands", "R-047"]}
  - {id: DR-PY-021, tech: [python], rx: '(?:\b(?:use|install|requires?|requirement|recommended?|minimum|version|runtime)\W{0,12}python ?3\.(?:[0-9]|10)\b)|Runtime\W{0,4}python3\.(?:[0-9]|10)\b|\bpython ?2\.7\b', issue: END_OF_LIFE_VERSION, severity: P2, action: UPDATE, label: "Python 3.10 or older named as a baseline",
     current: "Python 3.10 reached end of life 2026-10-01 and 3.9 on 2025-10-31; 3.11-3.15 are supported; 3.15.0 was released 2026-10-09 (endoflife.date data).", replacement: "Declare a tested matrix (3.12-3.14) and note 3.15", evidence: ["snapshot:python", "R-024", "R-046"]}
  - {id: DR-PY-022, tech: [docker, python, node], rx: 'FROM python:3\.(?:[0-9]|10)\b|FROM node:(?:1[0-9]|20|21|23|25)\b', issue: END_OF_LIFE_VERSION, severity: P2, action: UPDATE, label: "Docker base image on an end-of-life Python/Node line", current: "Python <=3.10 and Node 10-21, 23 and 25 are end of life (endoflife.date data and Node release page).", replacement: "Current LTS/supported tags, pinned by digest in production", evidence: ["snapshot:python", "snapshot:node", "R-040"]}
